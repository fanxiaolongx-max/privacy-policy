<!doctype html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data: blob:; font-src data:; object-src 'self' blob: data:; frame-src 'self' blob: data:; form-action 'none'; base-uri 'none'">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>奖励申报与评优</title>
<style>
:root{
  color-scheme:light;
  --bg:#f4f6f3;--paper:#fff;--ink:#182823;--muted:#62756d;--line:#dce4de;
  --brand:#136b51;--brand-light:#eaf6f0;--brand-hover:#0f5742;
  --gold:#9e6a17;--gold-bg:#fef8eb;
  --bad:#b3392b;--bad-bg:#fef1ee;--bad-line:#f8cdc5;
  --blue:#0369a1;--blue-bg:#f0f9ff;--blue-line:#bae6fd;
  --shadow:0 8px 30px rgba(18,52,38,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
.shell{max-width:1680px;margin:auto;padding:24px 28px 80px}
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--brand);font-weight:800;text-transform:uppercase}
.top h1{font-size:28px;letter-spacing:-.02em;margin:4px 0 2px;font-weight:800}
.sub{color:var(--muted);margin:0;font-size:13px}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:7px 14px;font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--muted)}

.monthly-reminder-wrap{margin:0 0 16px 0}
.monthly-reminder-card{background:linear-gradient(135deg,#fffdf7 0%,#fef9ee 100%);border:1px solid #fde68a;border-left:5px solid #d97706;border-radius:12px;padding:14px 18px;box-shadow:0 2px 8px rgba(217,119,6,.06);position:relative;transition:all .2s ease}
.monthly-reminder-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.monthly-reminder-title-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.monthly-reminder-icon{font-size:18px;line-height:1}
.monthly-reminder-title{font-size:14.5px;font-weight:700;color:#92400e}
.monthly-reminder-tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:10px;background:#fde68a;color:#78350f}
.monthly-reminder-close{background:transparent;border:none;font-size:18px;line-height:1;color:#92400e;cursor:pointer;padding:2px 6px;border-radius:4px;transition:background .15s}
.monthly-reminder-close:hover{background:rgba(146,64,14,.1)}
.monthly-reminder-desc{font-size:12.5px;line-height:1.6;color:#78350f;margin-top:6px;margin-bottom:12px}
.monthly-reminder-cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.monthly-cat-item{background:rgba(255,255,255,.85);border:1px solid rgba(245,158,11,.3);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;transition:all .15s}
.monthly-cat-item:hover{background:#fff;border-color:#d97706;box-shadow:0 2px 6px rgba(0,0,0,.04);transform:translateY(-1px)}
.monthly-cat-name{font-size:13.5px;font-weight:700;color:#78350f;display:flex;align-items:center;justify-content:space-between}
.monthly-cat-hint{font-size:11.5px;color:#92400e;margin-top:4px;line-height:1.45;flex:1}
.monthly-cat-action{margin-top:8px;align-self:flex-start;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:4px;border:1px solid #d97706;background:#fff;color:#b45309;cursor:pointer;transition:all .15s}
.monthly-cat-action:hover{background:#d97706;color:#fff}

.batch-count-preset-pill{padding:6px 14px;font-size:12.5px;font-weight:600;border-radius:20px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;transition:all .15s ease;user-select:none}
.batch-count-preset-pill:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-light)}
.batch-count-preset-pill.active{border-color:var(--brand);background:var(--brand);color:#fff;box-shadow:0 2px 6px rgba(19,107,81,.25)}
.batch-stepper-btn{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:22px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;user-select:none}
.batch-stepper-btn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-light)}
.batch-stepper-btn:active{transform:scale(.95)}
@keyframes popIn{0%{transform:scale(.94);opacity:0}100%{transform:scale(1);opacity:1}}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
.tab{border:1px solid var(--line);background:var(--paper);color:var(--ink);text-align:left;border-radius:14px;padding:16px 18px;min-height:92px;box-shadow:var(--shadow);transition:all .18s ease;user-select:none;cursor:pointer}
.tab:hover{border-color:var(--brand);transform:translateY(-1px)}
.tab.active{border-color:var(--brand);background:var(--brand-light);box-shadow:inset 0 0 0 1px var(--brand)}
.tab .tab-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.tab .tab-idx{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.tab.active .tab-idx{color:var(--brand)}
.tab .tab-count{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--bg);color:var(--ink)}
.tab.active .tab-count{background:rgba(15,118,110,.12);color:var(--brand);font-weight:700}
.tab strong{font-size:17px;display:block;margin-top:2px}
.tab small{display:block;color:var(--muted);margin-top:3px;font-size:12px}

.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;color:var(--muted);transition:all .15s ease;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;user-select:none;box-shadow:var(--shadow)}
.stat:hover{border-color:var(--brand);transform:translateY(-1px)}
.stat.active{border-color:var(--brand);background:var(--brand-light);box-shadow:inset 0 0 0 1px var(--brand)}
.stat b{display:block;font-size:26px;color:var(--brand);margin-top:4px;font-weight:800;letter-spacing:-.02em}
.stat-sub-hint{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:2px}
.stat.active .stat-sub-hint{color:var(--brand)}

.filter-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;margin-bottom:16px;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.search-wrap{position:relative;flex:1 1 240px;max-width:360px;display:flex;align-items:center}
.search-wrap svg{position:absolute;left:10px;width:14px;height:14px;color:var(--muted);pointer-events:none}
.search-wrap input{width:100%;height:34px;padding:0 10px 0 32px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:13px;color:var(--ink);outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(19,107,81,.15)}
.filter-tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.filter-tag-btn{height:30px;padding:0 12px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:8px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;user-select:none}
.filter-tag-btn:hover{background:var(--bg);color:var(--ink);border-color:var(--muted)}
.filter-tag-btn.active{background:var(--brand-light);color:var(--brand);border-color:var(--brand);font-weight:700}
.filter-clear-btn{height:30px;padding:0 10px;border:1px dashed var(--line);border-radius:8px;background:transparent;color:var(--muted);font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:all .15s}
.filter-clear-btn:hover{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}

.table-wrap{overflow:auto;width:100%;border:1px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:var(--shadow)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1080px;font-size:13px}
th,td{text-align:left;border-bottom:1px solid var(--line);padding:14px 16px;vertical-align:middle;line-height:1.55}
th{background:var(--bg);color:var(--muted);white-space:nowrap;font-weight:700;font-size:12px;letter-spacing:.02em}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:rgba(19,107,81,.03)}
.record-row{cursor:pointer;transition:background-color .12s ease}
.cell-title{font-weight:700;color:var(--ink);font-size:14px}
.cell-sub{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.cell-amount{font-weight:800;color:var(--brand);font-size:14.5px;letter-spacing:-.01em}
.cell-amount.none{font-weight:400;color:var(--muted);font-size:12px}
.cell-actions{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end;white-space:nowrap;flex-shrink:0}

.tag{display:inline-flex;align-items:center;border-radius:6px;padding:3px 8px;font-size:11.5px;font-weight:700;line-height:1.2;white-space:nowrap}
.tag.draft{background:var(--gold-bg);color:var(--gold);border:1px solid rgba(158,106,23,.25)}
.tag.published{background:var(--brand-light);color:var(--brand);border:1px solid rgba(19,107,81,.25)}
.tag.revoked{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-line)}
.tag.archived{background:var(--bg);color:var(--muted);border:1px solid var(--line)}

.btn{border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);padding:8px 14px;font-weight:650;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:all .15s ease}
.btn:hover{background:var(--bg);border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn.danger{color:var(--bad);border-color:var(--bad-line)}
.btn.danger:hover{background:var(--bad-bg);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.rec-action-btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:650;padding:5px 9px;min-height:28px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;white-space:nowrap;user-select:none;transition:all .15s ease}
.rec-action-btn svg{width:13px;height:13px;flex-shrink:0}
.rec-action-btn:hover{transform:translateY(-1px);box-shadow:0 2px 5px rgba(0,0,0,.08)}
.rec-action-btn.view-detail{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue)}
.rec-action-btn.view-detail:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.rec-action-btn.edit{background:var(--bg);color:var(--ink)}
.rec-action-btn.publish{background:var(--brand-light);border-color:var(--brand);color:var(--brand)}
.rec-action-btn.publish:hover{background:var(--brand);color:#fff}
.rec-action-btn.revoke{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.rec-action-btn.revoke:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
.rec-action-btn.archive-record{color:var(--muted)}
.rec-action-btn.unarchive-record{background:var(--brand-light);color:var(--brand);border-color:var(--brand)}
.rec-action-btn.unarchive-record:hover{background:var(--brand);color:#fff}
.rec-action-btn.delete-draft{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.rec-action-btn.delete-draft:hover{background:var(--bad);color:#fff}

.empty{border:1px dashed var(--line);border-radius:12px;padding:48px 24px;color:var(--muted);text-align:center;font-size:14px;background:var(--paper);margin:10px 0}
.toast{position:fixed;right:24px;bottom:24px;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:10px;box-shadow:var(--shadow);z-index:99999;font-weight:600;font-size:13.5px}
.hidden{display:none!important}

.modal-backdrop{position:fixed;inset:0;background:rgba(8,18,14,.65);backdrop-filter:blur(5px);display:grid;place-items:center;padding:20px;z-index:9999}
.modal{width:min(860px,100%);max-height:90vh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden}
.modal-head{padding:18px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--paper);flex-shrink:0}
.modal-head h2{margin:0;font-size:19px;font-weight:800}
.modal-close-btn{background:transparent;border:0;font-size:22px;color:var(--muted);cursor:pointer;padding:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.modal-close-btn:hover{background:var(--bg);color:var(--ink)}
.modal-body{padding:20px 24px;overflow-y:auto;overflow-x:hidden;flex:1;display:flex;flex-direction:column;gap:16px}
.modal-foot{padding:14px 24px;display:flex;align-items:center;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);background:var(--bg);flex-shrink:0}

.field{display:block;margin:0 0 14px}
.field span{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 12px;outline:none;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(19,107,81,.15)}
.field textarea{min-height:76px;resize:vertical}
.row{display:flex;gap:12px;align-items:flex-start}
.row>*{min-width:0;flex:1}

.detail-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.02)}
.detail-card h3{margin:0 0 12px;font-size:14px;font-weight:750;color:var(--ink);display:flex;align-items:center;gap:6px}
.detail-grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.detail-grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px}
.detail-item{display:flex;flex-direction:column;gap:3px}
.detail-label{font-size:11.5px;font-weight:700;color:var(--muted)}
.detail-val{font-size:13.5px;font-weight:500;color:var(--ink);word-break:break-word}

.revoked-notice-banner{background:var(--bad-bg);border:1px solid var(--bad-line);border-left:5px solid var(--bad);border-radius:10px;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.revoked-notice-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:750;color:var(--bad)}
.revoked-meta{font-size:12px;color:var(--bad);opacity:.9}
.revoked-reason-box{background:var(--paper);border:1px solid var(--bad-line);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--ink);white-space:pre-wrap}

.tbl-wrap{
  border:1px solid #d0d7d3;
  border-radius:6px;
  overflow:hidden;
  background:var(--paper);
  margin:8px 0;
  box-shadow:0 1px 2px rgba(0,0,0,0.03);
}
.editable-table{
  width:100%;
  border-collapse:collapse;
  font-size:12.5px;
  table-layout:fixed;
}
.editable-table th{
  background:#f6f8f6;
  color:#4a5d55;
  font-weight:700;
  font-size:12px;
  padding:6px 8px;
  text-align:left;
  border-right:1px solid #e2e8e4;
  border-bottom:1px solid #d0d7d3;
  white-space:nowrap;
}
.editable-table td{
  padding:4px 6px;
  border-right:1px solid #e8ede9;
  border-bottom:1px solid #e8ede9;
  vertical-align:middle;
}
.editable-table th:last-child,
.editable-table td:last-child{
  border-right:none;
}
.editable-table tr:last-child td{
  border-bottom:none;
}
.editable-table .merged-team-td{
  background:#f9fbfa;
  border-right:1px solid #d0d7d3;
  vertical-align:middle;
  padding:8px 10px;
  text-align:left;
}
.editable-table .merged-team-td .tbl-team-actions{
  display:flex;
  gap:4px;
  margin-top:6px;
  flex-wrap:wrap;
}
.tbl-team-subtotal{
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.tbl-team-subtotal b{
  color:var(--brand);
  font-weight:800;
  font-size:12px;
}

.tbl-input{
  width:100%;
  height:28px;
  line-height:28px;
  padding:0 7px;
  font-size:12.5px;
  border:1px solid #d0d7d3;
  border-radius:4px;
  box-sizing:border-box;
  background:var(--paper);
  color:var(--ink);
  transition:border-color .15s,box-shadow .15s;
}
.tbl-input:focus{
  border-color:var(--brand);
  outline:none;
  box-shadow:0 0 0 1.5px var(--brand-light);
}
.tbl-input.amt-input{
  font-weight:700;
  color:var(--brand);
}

.att-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  line-height: 1.2;
  padding: 2px 6px;
  border-radius: 4px;
  margin-top: 3px;
  cursor: default;
  transition: all .15s;
}
.att-badge.anomaly {
  background: #fef2f2;
  color: #b91c1c;
  border: 1px solid #fecaca;
  font-weight: 600;
  cursor: pointer;
}
.att-badge.anomaly:hover {
  background: #fee2e2;
  box-shadow: 0 1px 3px rgba(239, 68, 68, 0.2);
}
.att-badge.good {
  background: #f0fdf4;
  color: #15803d;
  border: 1px solid #bbf7d0;
}
.att-badge.neutral {
  background: #f8fafc;
  color: #64748b;
  border: 1px solid #e2e8f0;
}
.att-badge.checking {
  background: #f1f5f9;
  color: #475569;
  border: 1px dashed #cbd5e1;
}
.att-check-indicator {
  min-height: 18px;
}

.amt-cell-wrap{
  display:flex;
  align-items:center;
  gap:4px;
}
.amt-cell-wrap .tbl-input{
  flex:1 1 80px;
  min-width:65px;
}

.tbl-row-del-btn{
  width:26px;
  height:26px;
  line-height:24px;
  padding:0;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:bold;
  border-radius:4px;
  border:1px solid var(--bad-line);
  color:var(--bad);
  background:var(--bad-bg);
  cursor:pointer;
  transition:all .15s;
  box-sizing:border-box;
}
.tbl-row-del-btn:hover{
  background:var(--bad);
  color:#fff;
  border-color:var(--bad);
}

.tbl-btn{
  height:24px;
  line-height:22px;
  padding:0 6px;
  font-size:11px;
  font-weight:600;
  border-radius:4px;
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--ink);
  cursor:pointer;
  transition:all .15s;
  white-space:nowrap;
  box-sizing:border-box;
}
.tbl-btn:hover{
  border-color:var(--brand);
  color:var(--brand);
  background:var(--brand-light);
}
.tbl-btn.danger{
  color:var(--bad);
  border-color:var(--bad-line);
  background:var(--bad-bg);
}
.tbl-btn.danger:hover{
  background:var(--bad);
  color:#fff;
}

.table-toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  margin:10px 0 6px;
  background:var(--bg);
  border:1px solid var(--line);
  border-radius:8px;
  padding:6px 10px;
}
.toolbar-left{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:6px;
}
.quick-preset-btn{
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--brand);
  border-radius:6px;
  padding:3px 9px;
  font-size:11.5px;
  font-weight:700;
  cursor:pointer;
  line-height:1.4;
  transition:all .15s ease;
  white-space:nowrap;
}
.quick-preset-btn:hover{
  background:var(--brand-light);
  border-color:var(--brand);
}

.row-pct-pills{
  display:flex;
  gap:3px;
  align-items:center;
  margin-top:2px;
}
.pct-pill{
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--muted);
  border-radius:4px;
  padding:1px 5px;
  font-size:10px;

<script>
(() => {
  const API = '/api/reward-program';
let PAGES_SNAPSHOT = null;
let TP_RELATED_SNAPSHOT = null;

const TP_STATIC_READONLY_MESSAGE = '无权限，仅供查看。请联系管理员。';
function tpStaticJson(body, status = 200) {
  return new Response(JSON.stringify(body), { status, headers: { 'Content-Type': 'application/json; charset=utf-8' } });
}
function tpStaticNormalizeId(value) {
  const text = String(value || '').trim().toLowerCase();
  const match = text.match(/^[ua](\d{5,})$/);
  return match ? match[1] : text;
}
function tpStaticAttendance(person) {
  const source = TP_RELATED_SNAPSHOT.meeting || {};
  const attendance = source.attendance || {};
  const staffId = String(person?.staffId || person?.account || person?.id || '').trim();
  const name = String(person?.name || '').trim().toLowerCase();
  const normalizedId = tpStaticNormalizeId(staffId);
  let fallback = null;
  for (const [key, result] of Object.entries(attendance)) {
    const split = key.indexOf('|');
    const candidateId = split >= 0 ? key.slice(0, split) : key;
    const candidateName = split >= 0 ? key.slice(split + 1).trim().toLowerCase() : '';
    if (normalizedId && tpStaticNormalizeId(candidateId) === normalizedId) return result;
    if (name && candidateName && (candidateName === name || (name.length >= 2 && (candidateName.includes(name) || name.includes(candidateName))))) fallback = fallback || result;
  }
  return fallback || { found:false, hasAnomaly:false, cleanCount:0, anomalyCount:0, anomalies:[], records:[], totalMeetingsChecked:0 };
}
function tpStaticReadonlyResponse() {
  if (typeof showToast === 'function') showToast(TP_STATIC_READONLY_MESSAGE, 'warning');
  else if (typeof toast === 'function') toast(TP_STATIC_READONLY_MESSAGE, 'warning', 6000);
  return tpStaticJson({ success:false, error:TP_STATIC_READONLY_MESSAGE, code:'READ_ONLY_SNAPSHOT' }, 403);
}
function tpStaticApiResponse(url, options = {}) {
  const raw = String(url || '');
  let parsed;
  try { parsed = new URL(raw, 'https://tools-platform.invalid/'); } catch (_) { return null; }
  const pathname = parsed.pathname;
  const method = String(options.method || 'GET').toUpperCase();
  if (pathname === '/api/meeting-snapshots/attendance-check' && method === 'GET') {
    const result = tpStaticAttendance({ staffId: parsed.searchParams.get('staffId') || parsed.searchParams.get('account'), name: parsed.searchParams.get('name') });
    return tpStaticJson({ success:true, ...result, data:result });
  }
  if (pathname === '/api/meeting-snapshots/batch-attendance-check' && method === 'POST') {
    let body = {}; try { body = JSON.parse(options.body || '{}'); } catch (_) {}
    const results = {};
    for (const person of Array.isArray(body.persons) ? body.persons : []) results[String(person.staffId || '')+'|'+String(person.name || '')] = tpStaticAttendance(person);
    return tpStaticJson({ success:true, results, data:results });
  }
  if (pathname === '/api/meeting-snapshots/extract-roster' && method === 'GET') {
    const roster = TP_RELATED_SNAPSHOT.meeting?.roster || [];
    return tpStaticJson({ success:true, roster, items:roster, data:roster, count:roster.length });
  }
  if (pathname === '/api/meeting-snapshots' && method === 'GET') {
    const items = TP_RELATED_SNAPSHOT.meeting?.summaries || [];
    return tpStaticJson({ success:true, items, data:items, count:items.length });
  }
  if (pathname.startsWith('/api/meeting-snapshots/') && method === 'GET') {
    const id = decodeURIComponent(pathname.slice('/api/meeting-snapshots/'.length));
    const item = (TP_RELATED_SNAPSHOT.meeting?.snapshots || []).find(entry => String(entry.id) === id);
    return item ? tpStaticJson({ success:true, item, data:item }) : tpStaticJson({ success:false, error:'未找到指定会议快照' }, 404);
  }
  if (pathname === '/api/meeting-snapshots' || pathname.startsWith('/api/meeting-snapshots/')) return tpStaticReadonlyResponse();
  
  return null;
}
const pagesFetch = window.fetch.bind(window);
async function loadRelatedSnapshot() {
  if (!TP_RELATED_SNAPSHOT) {
    const response = await pagesFetch('./data/related.json', { cache: 'no-store' });
    if (!response.ok) throw new Error('关联数据读取失败');
    TP_RELATED_SNAPSHOT = await response.json();
  }
  return TP_RELATED_SNAPSHOT;
}
window.fetch = async (url, options = {}) => {
  if (String(url).startsWith('./data/') || String(url).startsWith('blob:') || String(url).startsWith('data:')) return pagesFetch(url, options);
  await loadRelatedSnapshot();
  return tpStaticApiResponse(url, options) || tpStaticReadonlyResponse();
};
  const cats = {
    bounty: ['01', '悬赏奖', '项目自申报 · 多团队分配'],
    position: ['02', '岗位激励', '固定岗位 · 周期发放'],
    operation: ['03', '操作激励', 'RFC / WFM · 工程师激励'],
    excellence: ['04', '代表处评优', '提名评议 · 公示归档']
  };

  const statusMap = {
    draft: { label: '草稿', tagClass: 'draft' },
    returned: { label: '草稿(已退回)', tagClass: 'draft' },
    published: { label: '已发布', tagClass: 'published' },
    completed: { label: '已归档', tagClass: 'archived' },
    archived: { label: '已归档', tagClass: 'archived' },
    revoked: { label: '已撤销', tagClass: 'revoked' },
    rejected: { label: '已驳回', tagClass: 'revoked' },
    submitted: { label: '待初审', tagClass: 'published' },
    department_approved: { label: '待AT评议', tagClass: 'published' },
    at_approved: { label: '待公示', tagClass: 'published' },
    publicity: { label: '公示中', tagClass: 'published' }
  };

  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const formatMoney = (minor, curr = 'EGP') => {
    if (!Number.isFinite(Number(minor))) return `0 ${curr}`;
    const val = Number(minor) / 100;
    const numStr = Number.isInteger(val)
      ? val.toLocaleString('en-US')
      : val.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return `${numStr} ${curr}`;
  };
  const egp = (minor, curr = 'EGP') => formatMoney(minor, curr);
  const formatStatus = s => statusMap[s]?.label || s || '未知';
  const minor = value => Math.round(Number(value || 0)) * 100;
  const bp = value => Math.round(Number(value || 0) * 100);

  const attCheckCache = new Map();

  async function checkPersonAttendanceStatus(staffId, name) {
    const s = String(staffId || '').trim();
    const n = String(name || '').trim();
    if (!s && !n) return null;
    const key = `${s.toLowerCase()}|${n.toLowerCase()}`;
    if (attCheckCache.has(key)) return attCheckCache.get(key);

    try {
      const res = await fetch(`/api/meeting-snapshots/attendance-check?staffId=${encodeURIComponent(s)}&name=${encodeURIComponent(n)}`);
      if (!res.ok) throw new Error('核验请求失败');
      const data = await res.json();
      const result = data.data || data;
      attCheckCache.set(key, result);
      return result;
    } catch (err) {
      console.warn('Attendance check error:', err);
      return null;
    }
  }

  async function updateAttendanceIndicator(containerEl, staffId, name) {
    if (!containerEl) return;
    const s = String(staffId || '').trim();
    const n = String(name || '').trim();
    if (!s && !n) {
      containerEl.innerHTML = '';
      return;
    }
    containerEl.innerHTML = '<span class="att-badge checking">⏳ 核验考勤中...</span>';
    const result = await checkPersonAttendanceStatus(s, n);
    if (!result || !result.found) {
      containerEl.innerHTML = '<span class="att-badge neutral" title="未在历史会议考勤快照中检索到该人员数据">ℹ️ 未查到考勤记录</span>';
      return;
    }
    if (result.hasAnomaly) {
      const details = (result.anomalies || []).map(a => `${a.meetingDate || a.title || '会议'}: ${a.attendance}`).join('\n');
      containerEl.innerHTML = `<span class="att-badge anomaly" title="${esc(details)}" data-details="${esc(details)}">⚠️ 考勤异常 (${result.anomalyCount}次)</span>`;
    } else {
      containerEl.innerHTML = `<span class="att-badge good" title="在检索到的 ${result.cleanCount} 次会议考勤中均全勤按时出席">✅ 考勤良好 (${result.cleanCount}次按时)</span>`;
    }
  }

  function getCommonAmounts() {
    const counts = new Map();
    state.applications.forEach(a => {
      if (a.totalAmountMinor != null && a.totalAmountMinor > 0) {
        const val = Math.round(Number(a.totalAmountMinor) / 100);
        if (val > 0) counts.set(val, (counts.get(val) || 0) + 1);
      }
    });
    const sorted = Array.from(counts.entries())
      .sort((a, b) => b[1] - a[1] || a[0] - b[0])
      .map(e => e[0]);
    const defaults = [500, 1000, 2000, 5000, 10000];
    return [...new Set([...sorted, ...defaults])].slice(0, 5).sort((a, b) => a - b);
  }

  const getCurMonthStr = () => {
    const d = new Date();
    return `${d.getFullYear()}年${d.getMonth() + 1}月`;
  };

  const emptyForm = category => ({
    category,
    ruleId: '',
    title: '',
    period: getCurMonthStr(),
    projectName: '',
    currency: 'EGP',
    summary: '',
    evidence: '',
    attachments: [],
    totalAmountMinor: 0,
    teams: [{ name: '', mode: 'amount', amountMinor: 0, members: [{ name: '', staffId: '', mode: 'amount', amountMinor: 0 }] }],
    recipients: [{ name: '', staffId: '', team: '', mode: 'amount', amountMinor: 0 }]
  });

  const state = {
    category: 'bounty',
    filter: 'all',
    search: '',
    rules: [],
    applications: [],
    isAdmin: false,
    username: ''
  };

  const $ = selector => document.querySelector(selector);

  function toast(message) {
    const el = $('#toast');
    el.textContent = message;
    el.classList.remove('hidden');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => el.classList.add('hidden'), 3500);
  }

  async function api(path, method = 'GET', body) {
    if (typeof window !== 'undefined' && typeof window.tpIsUnlocked === 'function' && !window.tpIsUnlocked()) {
      throw new Error('请先输入访问密码解锁页面');
    }
    if (method && method !== 'GET') {
      if (typeof toast === 'function') toast('无权限，仅供查看。请联系管理员。');
      throw new Error('无权限，仅供查看。请联系管理员。');
    }
    if (path === '/' || path === '') {
      if (!PAGES_SNAPSHOT) {
        const [rulesRes, appsRes] = await Promise.all([
          pagesFetch('./data/rules.json', { cache: 'no-store' }),
          pagesFetch('./data/applications.json', { cache: 'no-store' })
        ]);
        if (!rulesRes.ok || !appsRes.ok) throw new Error('静态数据读取失败');
        const [rules, applications] = await Promise.all([rulesRes.json(), appsRes.json()]);
        PAGES_SNAPSHOT = { rules, applications, username: '', isAdmin: false };
      }
      return PAGES_SNAPSHOT;
    }
    if (path.startsWith('/rules')) {
      if (!PAGES_SNAPSHOT) await api('/');
      return PAGES_SNAPSHOT.rules || [];
    }
    if (path.startsWith('/applications')) {
      if (!PAGES_SNAPSHOT) await api('/');
      return PAGES_SNAPSHOT.applications || [];
    }
    if (typeof toast === 'function') toast('无权限，仅供查看。请联系管理员。');
    throw new Error('无权限，仅供查看。请联系管理员。');
  }

  async function load() {
    const data = await api('/');
    state.rules = data.rules || [];
    state.applications = data.applications || [];
    state.username = data.username || '';
    state.isAdmin = Boolean(data.isAdmin);
    render();

    if (!hasShownEntryToast) {
      hasShownEntryToast = true;
      const { curMonthStr, curIsoMonth } = getCurrentMonthInfo();
      const thisMonthApps = state.applications.filter(a => {
        if (a.status !== 'published') return false;
        if (a.period && (a.period.includes(curMonthStr) || a.period.includes(curIsoMonth))) return true;
        if (a.createdAt && a.createdAt.startsWith(curIsoMonth)) return true;
        return false;
      });
      if (thisMonthApps.length === 0) {
        toast(`📢 温馨提示：本月（${curMonthStr}）暂无已发布的奖励申报记录，请及时向 HR 提报！`);
      }
    }
  }

  function rulesFor(category = state.category) {
    return state.rules.filter(r => r.category === category && !r.archived);
  }

  function getUnifiedStatus(item) {
    const s = item.status;
    if (s === 'draft' || s === 'returned') return 'draft';
    if (s === 'revoked' || s === 'rejected') return 'revoked';
    if (s === 'archived' || s === 'completed') return 'archived';
    return 'published';
  }

  function getFilteredRecords() {
    return state.applications.filter(a => {
      if (a.category !== state.category) return false;
      const uStatus = getUnifiedStatus(a);
      if (state.filter !== 'all' && uStatus !== state.filter) return false;
      if (state.search) {
        const q = state.search.toLowerCase();
        const ruleName = (state.rules.find(r => r.id === a.ruleId)?.name || '').toLowerCase();
        const title = (a.title || '').toLowerCase();
        const project = (a.projectName || '').toLowerCase();
        const applicant = (a.applicant || '').toLowerCase();
        const recipients = (a.category === 'bounty'
          ? (a.teams || []).flatMap(t => [t.name, ...(t.members || []).map(m => m.name)])
          : (a.recipients || []).map(r => r.name)
        ).join(' ').toLowerCase();
        if (!title.includes(q) && !project.includes(q) && !applicant.includes(q) && !ruleName.includes(q) && !recipients.includes(q)) {
          return false;
        }
      }
      return true;
    });
  }

  const catHints = {
    bounty: {
      desc: '重大项目交付与关键攻坚突破',
      detail: '支持跨团队、多部门联合申报与自主比例分配，请项目负责人及时向 HR 发起申报。'
    },
    position: {
      desc: '关键保障与固定岗位职责履职',

    }
  };

  let dismissedMonthlyReminder = false;
  let hasShownEntryToast = false;

  const getCurrentMonthInfo = () => {
    const d = new Date();
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    return {
      curMonthStr: `${y}年${m}月`,
      curIsoMonth: `${y}-${String(m).padStart(2, '0')}`
    };
  };

  function renderMonthlyReminder() {
    const banner = $('#monthlyReminderBanner');
    if (!banner) return;
    if (dismissedMonthlyReminder) {
      banner.innerHTML = '';
      return;
    }

    const { curMonthStr, curIsoMonth } = getCurrentMonthInfo();
    const thisMonthApps = state.applications.filter(a => {
      // 按照当月已发布的来看，不计草稿、撤销、归档
      if (a.status !== 'published') return false;
      if (a.period && (a.period.includes(curMonthStr) || a.period.includes(curIsoMonth))) return true;
      if (a.createdAt && a.createdAt.startsWith(curIsoMonth)) return true;
      return false;
    });

    const isTotalZero = thisMonthApps.length === 0;
    const undeclaredCats = Object.keys(cats).filter(k => !thisMonthApps.some(a => a.category === k));

    if (undeclaredCats.length === 0) {
      banner.innerHTML = '';
      return;
    }

    banner.innerHTML = `
      <div class="monthly-reminder-card">
        <div class="monthly-reminder-header">
          <div class="monthly-reminder-title-wrap">
            <span class="monthly-reminder-icon">⏰</span>
            <span class="monthly-reminder-title">${isTotalZero ? `【${curMonthStr}】暂无任何奖励申报记录，请及时申报给 HR！` : `【${curMonthStr}】尚有 ${undeclaredCats.length} 个奖项大类未提交申报`}</span>
            <span class="monthly-reminder-tag">${isTotalZero ? '本月待申报' : '部分待补报'}</span>
          </div>
          <button type="button" class="monthly-reminder-close" id="btnCloseMonthlyReminder" title="暂时收起提示">×</button>
        </div>
        <div class="monthly-reminder-desc">
          温馨提示：为确保各项激励措施按时审批与发放，请各部门负责人、项目主管及业务团队及时梳理本月突出贡献与激励对象，向 HR 提报流转。以下为未申报的奖项大类指引：
        </div>
        <div class="monthly-reminder-cats">
          ${undeclaredCats.map(k => {
            const c = cats[k];
            const h = catHints[k] || {};
            return `
              <div class="monthly-cat-item">
                <div class="monthly-cat-name">
                  <span>${esc(c[1])}</span>
                  <span style="font-size:11px;font-weight:600;color:#d97706;background:#fef3c7;padding:1px 6px;border-radius:4px">本月未申报</span>
                </div>
                <div class="monthly-cat-hint">${esc(h.desc)}。${esc(h.detail)}</div>
                <button type="button" class="monthly-cat-action" data-quick-apply-cat="${k}">＋ 申报${esc(c[1])}</button>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;

    $('#btnCloseMonthlyReminder')?.addEventListener('click', () => {
      dismissedMonthlyReminder = true;
      banner.innerHTML = '';
    });

    banner.querySelectorAll('[data-quick-apply-cat]').forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = btn.dataset.quickApplyCat;
        if (cat) {
          state.category = cat;
          renderTabs();
          renderStats();
          renderTable();
          openEditor();
        }
      });
    });
  }

  function renderTabs() {
    const countCat = cat => state.applications.filter(a => a.category === cat).length;
    $('#tabs').innerHTML = Object.entries(cats).map(([key, c]) => `
      <button type="button" class="tab ${key === state.category ? 'active' : ''}" data-tab="${key}">
        <div class="tab-top">
          <span class="tab-idx">类别 ${c[0]}</span>
          <span class="tab-count">${countCat(key)} 条</span>
        </div>
        <strong>${c[1]}</strong>
        <small>${c[2]}</small>
      </button>
    `).join('');
  }

  function renderStats() {
    const list = state.applications.filter(a => a.category === state.category);
    const counts = {
      all: list.length,
      draft: list.filter(a => getUnifiedStatus(a) === 'draft').length,
      published: list.filter(a => getUnifiedStatus(a) === 'published').length,
      revoked: list.filter(a => getUnifiedStatus(a) === 'revoked').length,
      archived: list.filter(a => getUnifiedStatus(a) === 'archived').length
    };

    const items = [
      { key: 'all', title: '全部记录', sub: '当前类别所有申报', count: counts.all },
      { key: 'draft', title: '待发草稿', sub: '待完善并正式发布', count: counts.draft },
      { key: 'published', title: '已发布', sub: '正式生效的奖励记录', count: counts.published },
      { key: 'revoked', title: '已撤销', sub: '撤销作废留痕记录', count: counts.revoked },
      { key: 'archived', title: '已归档', sub: '历史封存归档记录', count: counts.archived }
    ];

    $('#statsRow').innerHTML = items.map(it => `
      <div class="stat ${state.filter === it.key ? 'active' : ''}" data-filter="${it.key}">
        <span>${it.title}</span>
        <b>${it.count}</b>
        <span class="stat-sub-hint">${it.sub}</span>
      </div>
    `).join('');
  }

  function renderFilterTags() {
    const tags = [
      ['all', '全部'],
      ['draft', '草稿'],
      ['published', '已发布'],
      ['revoked', '已撤销'],
      ['archived', '已归档']
    ];
    $('#filterTags').innerHTML = tags.map(([key, name]) => `
      <button type="button" class="filter-tag-btn ${state.filter === key ? 'active' : ''}" data-filter="${key}">${name}</button>
    `).join('');
  }

  function renderTable() {
    const records = getFilteredRecords();
    const tbody = $('#recordsTbody');
    if (!records.length) {
      tbody.innerHTML = `<tr><td colspan="7"><div class="empty">当前筛选条件下暂无记录。点击上方“＋ 新增奖励申报”创建一条新申请。</div></td></tr>`;
      return;
    }

    tbody.innerHTML = records.map(item => {
      const uStatus = getUnifiedStatus(item);
      const rule = state.rules.find(r => r.id === item.ruleId);
      const st = statusMap[item.status] || { label: item.status, tagClass: 'published' };
      const isOwner = item.applicant === state.username;
      const canEditDraft = (uStatus === 'draft') && (isOwner || state.isAdmin);
      const canDeleteDraft = (uStatus === 'draft') && (isOwner || state.isAdmin);
      const canPublish = (uStatus === 'draft') && (isOwner || state.isAdmin);
      const canForceEdit = (uStatus === 'published') && state.isAdmin;
      const canRevoke = (uStatus === 'published') && state.isAdmin;
      const canArchive = (uStatus === 'published' || uStatus === 'revoked') && state.isAdmin;
      const canUnarchive = (uStatus === 'archived') && state.isAdmin;

      const recipientNames = (item.category === 'bounty'
        ? (item.teams || []).map(t => `${t.name} (${(t.members || []).map(m => m.name).join('、') || '全员'})`).join('；')
        : (item.recipients || []).map(r => r.name).join('、')
      ) || '未填对象';

        <tr class="record-row" data-id="${esc(item.id)}">
          <td>
            <div class="cell-title">

              ${item.attachments && item.attachments.length ? `<span class="attach-badge" style="cursor:pointer" data-preview-url="${esc(item.attachments[0])}" data-preview-title="${esc(item.title)} - 证明材料原件" title="含 ${item.attachments.length} 份证明材料附件，点击在页面内预览">📎 ${item.attachments.length}</span>` : ''}
            </div>
            <span class="cell-sub">${esc(rule?.name || item.ruleId || '未设规则')}</span>
          </td>
          <td>
            <div>${esc(item.period || '-')}</div>
            <span class="cell-sub">${esc(item.projectName || '-')}</span>
          </td>
          <td>
            ${item.totalAmountMinor != null ? `<span class="cell-amount">${formatMoney(item.totalAmountMinor, item.currency || 'EGP')}</span>` : `<span class="cell-amount none">金额不公开</span>`}
          </td>
          <td>
            <div><b>${esc(item.applicant || '系统')}</b> · 申报</div>
            <span class="cell-sub" title="${esc(recipientNames)}">${esc(recipientNames)}</span>
          </td>
          <td>
            <span class="tag ${st.tagClass}">${esc(st.label)}</span>
          </td>
          <td>
            <span class="cell-sub">${esc((item.updatedAt || item.createdAt || '').slice(0, 10))}</span>
          </td>
          <td style="text-align:right">
            <div class="cell-actions">
              <button type="button" class="rec-action-btn view-detail" data-action="detail" data-id="${esc(item.id)}" title="查看申报详情与分配记录">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="6.5"/><path d="M8 7v4M8 4.5h.01"/></svg>
                <span>详情</span>
              </button>

              ${canPublish ? `
                <button type="button" class="rec-action-btn publish" data-action="publish" data-id="${esc(item.id)}" title="审核并正式发布此记录">
                  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 8.5l3.5 3.5 7-7"/></svg>
                  <span>发布</span>
                </button>
              ` : ''}

              ${canEditDraft ? `
                <button type="button" class="rec-action-btn edit" data-action="edit" data-id="${esc(item.id)}" title="编辑草稿内容">
                  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 2l3 3-9 9H2v-3l9-9z"/></svg>
                  <span>编辑</span>
                </button>
              ` : ''}

              ${canForceEdit ? `
                <button type="button" class="rec-action-btn edit" data-action="edit" data-id="${esc(item.id)}" title="修改已发布记录">
                  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 2l3 3-9 9H2v-3l9-9z"/></svg>
                  <span>修改</span>
                </button>
              ` : ''}

              ${canRevoke ? `
                <button type="button" class="rec-action-btn revoke" data-action="revoke" data-id="${esc(item.id)}" title="撤销此条已发布记录">
                  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h7a4 4 0 0 1 4 4v0a4 4 0 0 1-4 4H5"/><path d="M6 4L3 7l3 3"/></svg>
                  <span>撤销</span>
                </button>

              ${canArchive ? `

                  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3V1h6v2M2 4h12M4 4v10h8V4"/></svg>
                  <span>归档</span>
                </button>
              ` : ''}

              ${canUnarchive ? `
                <button type="button" class="rec-action-btn unarchive-record" data-action="unarchive" data-id="${esc(item.id)}" title="恢复此归档记录为已发布">
                  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h7a4 4 0 0 1 4 4v0a4 4 0 0 1-4 4H5"/><path d="M6 4L3 7l3 3"/></svg>
                  <span>恢复</span>
                </button>
              ` : ''}

              ${canDeleteDraft ? `
                <button type="button" class="rec-action-btn delete-draft danger" data-action="delete" data-id="${esc(item.id)}" title="删除此草稿">
                  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 4h11M5.5 4V2.5A1.5 1.5 0 0 1 7 1h2a1.5 1.5 0 0 1 1.5 1.5V4m2 0v9a1.5 1.5 0 0 1-1.5 1.5h-6A1.5 1.5 0 0 1 3.5 13V4"/></svg>
                  <span>删除</span>
                </button>
              ` : ''}
            </div>
          </td>
        </tr>
      `;
    }).join('');
  }

  function render() {
    $('#identity').textContent = `${state.isAdmin ? '管理员' : '申报人'} · ${state.username}`;
    renderMonthlyReminder();
    renderTabs();

  // ================= 弹窗系统 (Modals) =================

  function openBatchAddCountDialog({ title = '批量增加数量', subject = '成员', max = 50, defaultCount = 5, onConfirm }) {
    const host = $('#subModalHost') || $('#modalHost');
    let currentCount = Math.min(Math.max(1, defaultCount), max);

    function renderModal() {
      host.innerHTML = `
        <div class="modal-backdrop" id="subModalBackdrop" style="z-index:1200;background:rgba(15,23,42,0.45);backdrop-filter:blur(3px)">
          <div class="modal" style="width:min(440px,94vw);border-radius:16px;box-shadow:0 20px 40px rgba(0,0,0,0.2);animation:popIn .2s cubic-bezier(0.16,1,0.3,1);overflow:hidden">
            <div class="modal-head" style="padding:16px 20px;border-bottom:1px solid var(--line);background:var(--paper)">
              <div style="display:flex;align-items:center;gap:10px">
                <div style="width:36px;height:36px;border-radius:10px;background:var(--brand-light);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:18px">👥</div>
                <div>
                  <h2 style="font-size:16px;margin:0;font-weight:700;color:var(--ink)">${esc(title)}</h2>
                  <div style="font-size:12px;color:var(--muted);margin-top:2px">设置需要一次性添加的${esc(subject)}行数</div>
                </div>
              </div>
              <button type="button" class="modal-close-btn" id="closeSubModal">×</button>
            </div>
            <div class="modal-body" style="padding:20px;background:var(--paper)">
              <div style="margin-bottom:16px">
                <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px">快捷选择数量</div>
                <div style="display:flex;gap:8px;flex-wrap:wrap">
                  ${[3, 5, 8, 10, 15, 20].map(n => `
                    <button type="button" class="batch-count-preset-pill ${n === currentCount ? 'active' : ''}" data-batch-preset="${n}">${n} 人</button>
                  `).join('')}
                </div>
              </div>

              <div style="margin-top:16px">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                  <span style="font-size:12px;font-weight:600;color:var(--muted)">输入或微调数量</span>
                  <span style="font-size:11.5px;color:var(--muted)">范围 1 ~ ${max} 人</span>
                </div>
                <div style="display:flex;align-items:center;gap:10px">
                  <button type="button" class="batch-stepper-btn" id="btnStepMinus" title="减少 1 人">−</button>
                  <div style="flex:1;position:relative">
                    <input type="number" id="batchCountInput" min="1" max="${max}" value="${currentCount}" style="width:100%;height:44px;text-align:center;font-size:20px;font-weight:800;color:var(--brand);border:1px solid var(--line);border-radius:10px;background:var(--paper);outline:none;transition:all .15s" autofocus>
                    <span style="position:absolute;right:14px;top:13px;font-size:13px;font-weight:600;color:var(--muted);pointer-events:none">人</span>
                  </div>
                  <button type="button" class="batch-stepper-btn" id="btnStepPlus" title="增加 1 人">+</button>
                </div>
              </div>
            </div>
            <div class="modal-foot" style="padding:14px 20px;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px">
              <button type="button" class="btn" id="btnCancelSubModal" style="padding:8px 16px;font-size:13px">取消</button>
              <button type="button" class="btn primary" id="btnConfirmBatchCount" style="padding:8px 22px;font-size:13px;font-weight:700">确认添加 (<span id="batchCountLabel">${currentCount}</span> 人)</button>
            </div>
          </div>
        </div>
      `;

      const input = $('#batchCountInput');
      const label = $('#batchCountLabel');

      const updateVal = n => {
        currentCount = Math.min(Math.max(1, Math.round(Number(n) || 1)), max);
        if (input) input.value = currentCount;
        if (label) label.textContent = currentCount;
        host.querySelectorAll('[data-batch-preset]').forEach(btn => {
          btn.classList.toggle('active', Number(btn.dataset.batchPreset) === currentCount);
        });
      };

      $('#closeSubModal')?.addEventListener('click', () => { host.innerHTML = ''; });
      $('#btnCancelSubModal')?.addEventListener('click', () => { host.innerHTML = ''; });
      $('#subModalBackdrop')?.addEventListener('click', ev => {
        if (ev.target.id === 'subModalBackdrop') host.innerHTML = '';
      });

      host.querySelectorAll('[data-batch-preset]').forEach(btn => {
        btn.addEventListener('click', () => {
          updateVal(Number(btn.dataset.batchPreset));
        });
      });

      $('#btnStepMinus')?.addEventListener('click', () => {
        updateVal(currentCount - 1);
      });

      $('#btnStepPlus')?.addEventListener('click', () => {
        updateVal(currentCount + 1);
      });

      input?.addEventListener('input', () => {
        const val = Number(input.value);
        if (Number.isFinite(val) && val >= 1 && val <= max) {
          currentCount = Math.round(val);
          if (label) label.textContent = currentCount;
          host.querySelectorAll('[data-batch-preset]').forEach(btn => {
            btn.classList.toggle('active', Number(btn.dataset.batchPreset) === currentCount);
          });
        }
      });

      input?.addEventListener('change', () => {
        updateVal(input.value);
      });

      input?.addEventListener('keydown', ev => {
        if (ev.key === 'Enter') {
          ev.preventDefault();
          $('#btnConfirmBatchCount')?.click();
        } else if (ev.key === 'Escape') {
          host.innerHTML = '';
        }
      });

      $('#btnConfirmBatchCount')?.addEventListener('click', () => {
        const count = currentCount;
        host.innerHTML = '';
        if (onConfirm) onConfirm(count);
      });

      setTimeout(() => {
        input?.focus();
        input?.select();
      }, 50);
    }

    renderModal();
  }

  async function openAttachmentModal(url, title = '') {
    if (!url) return;
    const cleanUrl = String(url).trim();
    const filename = cleanUrl.split('/').pop() || '附件';
    const ext = (filename.split('.').pop() || '').toLowerCase();
    const isImg = ['png', 'jpg', 'jpeg', 'webp', 'gif'].includes(ext);
    const isPdf = ext === 'pdf';
    const isTxt = ext === 'txt';
    const isArchive = ['zip', 'rar', '7z', 'tar', 'gz'].includes(ext);
    const isEmail = ['eml', 'msg'].includes(ext);

    const icon = isImg ? '🖼️' : isPdf ? '📄' : isTxt ? '📝' : isArchive ? '📦' : isEmail ? '✉️' : '📎';

    let contentHtml = '';

      contentHtml = `
        <div style="max-height:72vh;overflow:auto;display:flex;justify-content:center;align-items:center;width:100%">
          <img src="${esc(cleanUrl)}" alt="${esc(filename)}" style="max-width:100%;max-height:70vh;object-fit:contain;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,0.12);background:#fff">
        </div>
      `;
    } else if (isPdf) {
      contentHtml = `
        <iframe src="${esc(cleanUrl)}" style="width:100%;height:72vh;border:none;border-radius:6px;background:#fff" title="PDF文档预览"></iframe>
      `;
    } else if (isTxt) {
      contentHtml = `
        <div id="attachTextLoading" style="padding:40px;color:var(--muted)">正在读取文本内容...</div>
        <div id="attachTextContent" style="display:none;width:100%;height:70vh;overflow:auto;padding:16px;background:var(--paper);border:1px solid var(--line);border-radius:8px;font-family:monospace;font-size:13px;line-height:1.6;white-space:pre-wrap;color:var(--ink)"></div>

    } else if (isArchive) {
      contentHtml = `
        <div style="text-align:center;padding:40px 20px;max-width:520px">
          <div style="font-size:56px;margin-bottom:16px">📦</div>
          <h4 style="margin:0 0 8px;font-size:16px;color:var(--ink)">${esc(filename)}</h4>
          <p style="font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 20px">
            该附件为 <b>${ext.toUpperCase()} 归档压缩包</b>。<br>
            浏览器无法直接在网页内解压展示压缩包中的文件内容。请点击下方按钮下载至本地后解压查阅。
          </p>
          <a href="${esc(cleanUrl)}" download="${esc(filename)}" class="btn primary" style="padding:9px 24px;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:6px">
            📥 下载压缩包 (${ext.toUpperCase()})
          </a>
        </div>
      `;
    } else if (isEmail) {
      contentHtml = `
        <div style="text-align:center;padding:40px 20px;max-width:520px">
          <div style="font-size:56px;margin-bottom:16px">✉️</div>
          <h4 style="margin:0 0 8px;font-size:16px;color:var(--ink)">${esc(filename)}</h4>

  function getPeriodOptions() {
    const now = new Date();
    const curY = now.getFullYear();
    const curM = now.getMonth() + 1;
    const curQ = Math.ceil(curM / 3);

    const curMonthStr = `${curY}年${curM}月`;
    const lastMonthDate = new Date(curY, now.getMonth() - 1, 1);
    const lastMonthStr = `${lastMonthDate.getFullYear()}年${lastMonthDate.getMonth() + 1}月`;
    const curQStr = `${curY}年Q${curQ}`;
    const lastQ = curQ === 1 ? 4 : curQ - 1;
    const lastQYear = curQ === 1 ? curY - 1 : curY;
    const lastQStr = `${lastQYear}年Q${lastQ}`;

    const months = [];
    for (let i = 1; i >= -11; i--) {
      const d = new Date(curY, now.getMonth() + i, 1);
      months.push(`${d.getFullYear()}年${d.getMonth() + 1}月`);
    }

    const quarters = [];
    for (let i = 0; i < 6; i++) {
      let q = curQ - i;
      let y = curY;
      while (q <= 0) {
        q += 4;
        y -= 1;
      }
      quarters.push(`${y}年Q${q}`);
    }

    return { curMonthStr, lastMonthStr, curQStr, lastQStr, months, quarters };
  }

    function getPresetsForCount(count) {
      if (count === 2) {
        return [
          { label: '6:4 比例', pcts: [60, 40] },
          { label: '7:3 比例', pcts: [70, 30] },
          { label: '8:2 比例', pcts: [80, 20] }
        ];
      }
      if (count === 3) {
        return [
          { label: '5:3:2 梯队', pcts: [50, 30, 20] },
          { label: '4:3:3 梯队', pcts: [40, 30, 30] },
          { label: '6:2.5:1.5', pcts: [60, 25, 15] }
        ];
      }
      if (count === 4) {
        return [
          { label: '4:3:2:1 梯队', pcts: [40, 30, 20, 10] },
          { label: '5:2:2:1 梯队', pcts: [50, 20, 20, 10] }
        ];
      }
      if (count === 5) {
        return [
          { label: '35:25:20:10:10', pcts: [35, 25, 20, 10, 10] }
        ];
      }
      return [];
    }

                          <div class="row-pct-pills">

      } else {

        }

        container.innerHTML = `
          <div class="table-toolbar">
            <div class="toolbar-left">
              <span style="font-size:12px;font-weight:700;color:var(--muted)">快捷分配：</span>
              <button type="button" class="quick-preset-btn" id="btnSplitEqual" title="将奖励总额均分给所有获奖对象">⚖️ 一键均分</button>
              ${presets.map(p => `
                <button type="button" class="quick-preset-btn" data-preset-pcts="${esc(JSON.stringify(p.pcts))}" title="按 ${p.pcts.join(':')} 比例分配总额">${p.label}</button>
              `).join('')}
            </div>
            <div class="toolbar-right">
              <span style="font-size:11.5px;color:var(--muted)">可点击行内“50%”、“30%”或“填剩余”快速配平</span>
            </div>
          </div>
          <div class="tbl-wrap">
            <table class="editable-table">
              <colgroup>
                <col style="width:22%">
                <col style="width:22%">
                <col style="width:18%">
                <col style="width:32%">
                <col style="width:6%">
              </colgroup>
              <thead>
                <tr>
                  <th>获奖人姓名 *</th>
                  <th>所属部门/团队</th>
                  <th>工号 (选填)</th>
                  <th>分配金额 (${curr}) *</th>
                  <th style="text-align:center">操作</th>
                </tr>
              </thead>
              <tbody>
                ${form.recipients.map((r, i) => `
                  <tr>
                    <td>
                      <input type="text" class="tbl-input" data-rec-idx="${i}" data-key="name" value="${esc(r.name)}" placeholder="姓名" required>
                      <div class="att-check-indicator" data-rec-idx="${i}"></div>
                    </td>
                    <td>
                      <input type="text" class="tbl-input" data-rec-idx="${i}" data-key="team" value="${esc(r.team || '')}" placeholder="部门/团队">
                    </td>
                    <td>
                      <input type="text" class="tbl-input" data-rec-idx="${i}" data-key="staffId" value="${esc(r.staffId || '')}" placeholder="工号">
                    </td>
                    <td>
                      <div class="amt-cell-wrap">
                        <input type="number" step="1" min="0" class="tbl-input amt-input" data-rec-idx="${i}" data-key="amount" value="${r.amountMinor ? Math.round(Number(r.amountMinor)/100) : ''}" placeholder="0" required>
                        <div class="row-pct-pills">
                          <button type="button" class="pct-pill" data-row-pct="50" data-rec-idx="${i}" title="按总额50%填入">50%</button>
                          <button type="button" class="pct-pill" data-row-pct="30" data-rec-idx="${i}" title="按总额30%填入">30%</button>
                          <button type="button" class="pct-pill" data-row-pct="20" data-rec-idx="${i}" title="按总额20%填入">20%</button>
                          <button type="button" class="pct-pill fill-rem" data-fill-rem="true" data-rec-idx="${i}" title="自动填入未分配差额">填剩余</button>
                        </div>
                      </div>
                    </td>
                    <td style="text-align:center">
                      <button type="button" class="tbl-row-del-btn" data-del-rec="${i}" title="删除该对象">×</button>

                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
          <div style="display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap">
            <button type="button" class="btn" id="btnAddRecipient">＋ 添加获奖对象</button>
            <button type="button" class="btn" data-add-recipients-count="5" style="font-size:12px;padding:6px 12px" title="一次性增加 5 位获奖对象">+5 人</button>
            <button type="button" class="btn" data-add-recipients-count="10" style="font-size:12px;padding:6px 12px" title="一次性增加 10 位获奖对象">+10 人</button>
            <button type="button" class="btn" id="btnBatchAddRecipients" style="font-size:12px;padding:6px 12px" title="输入指定数量批量添加获奖对象">+ 指定数量</button>
          </div>
        `;
