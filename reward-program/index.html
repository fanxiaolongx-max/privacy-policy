      setTimeout(() => {
        container.querySelectorAll('.att-check-indicator').forEach(ind => {
          const tr = ind.closest('tr');
          if (!tr) return;
          const nameInput = tr.querySelector('[data-key="member-name"], [data-key="name"]');
          const staffInput = tr.querySelector('[data-key="member-staffId"], [data-key="staffId"]');
          if (nameInput?.value?.trim() || staffInput?.value?.trim()) {
            updateAttendanceIndicator(ind, staffInput?.value, nameInput?.value);
          }
        });
      }, 0);

      updateSummary();
    }

    function updateSummary() {
      const total = Number(form.totalAmountMinor || 0);
      const isBounty = category === 'bounty';
      const curr = form.currency || 'EGP';

      let allocated = 0;
      if (isBounty) {
        form.teams.forEach((t, i) => {
          const sub = (t.members || []).reduce((s, m) => s + (Number(m.amountMinor) || 0), 0);
          t.amountMinor = sub;
          allocated += sub;
          const subEl = document.getElementById(`team-subtotal-${i}`);
          if (subEl) subEl.textContent = formatMoney(sub, curr);
        });
      } else {
        allocated = (form.recipients || []).reduce((s, r) => s + (Number(r.amountMinor) || 0), 0);
      }

      const diff = total - allocated;
      const bar = $('#formSummaryBar');
      if (bar) {
        bar.classList.toggle('bad', diff !== 0);
        bar.innerHTML = `
          <span>已分配: <b>${formatMoney(allocated, curr)}</b> / 总额: <b>${formatMoney(total, curr)}</b></span>
          <span>${diff === 0 ? '✓ 金额分配完全平衡' : `待平衡差额: ${formatMoney(diff, curr)}`}</span>
        `;
      }
    }

    function syncFormValues() {
      form.ruleId = $('#fieldRuleId')?.value || '';
      form.period = $('#fieldPeriod')?.value.trim() || '';
      form.title = $('#fieldTitle')?.value.trim() || '';
      if (category === 'bounty') form.projectName = $('#fieldProject')?.value.trim() || '';
      form.currency = $('#fieldCurrency')?.value || 'EGP';
      form.totalAmountMinor = minor($('#fieldTotalAmount')?.value || 0);
      form.summary = $('#fieldSummary')?.value.trim() || '';
      form.evidence = $('#fieldEvidence')?.value.trim() || '';

      if (category === 'bounty') {
        form.teams.forEach((t, i) => {
          t.name = document.querySelector(`[data-team-idx="${i}"][data-key="team-name"]`)?.value.trim() || '';
          t.mode = 'amount';
          let teamSum = 0;
          (t.members || []).forEach((m, j) => {
            m.name = document.querySelector(`[data-team-idx="${i}"][data-member-idx="${j}"][data-key="member-name"]`)?.value.trim() || '';
            m.staffId = document.querySelector(`[data-team-idx="${i}"][data-member-idx="${j}"][data-key="member-staffId"]`)?.value.trim() || '';
            m.mode = 'amount';
            const mVal = document.querySelector(`[data-team-idx="${i}"][data-member-idx="${j}"][data-key="member-amount"]`)?.value || '0';
            m.amountMinor = minor(mVal);
            m.percentBp = null;
            teamSum += m.amountMinor;
          });
          t.amountMinor = teamSum;
          t.percentBp = null;
        });
      } else {
        form.recipients.forEach((r, i) => {
          r.name = document.querySelector(`[data-rec-idx="${i}"][data-key="name"]`)?.value.trim() || '';
          r.team = document.querySelector(`[data-rec-idx="${i}"][data-key="team"]`)?.value.trim() || '';
          r.staffId = document.querySelector(`[data-rec-idx="${i}"][data-key="staffId"]`)?.value.trim() || '';
          r.mode = 'amount';
          const val = document.querySelector(`[data-rec-idx="${i}"][data-key="amount"]`)?.value || '0';
          r.amountMinor = minor(val);
          r.percentBp = null;
        });
      }
    }

    function bindFormEvents() {
      document.querySelectorAll('.quick-p-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const val = btn.dataset.setPeriod;
          if (val) {
            const input = $('#fieldPeriod');
            if (input) input.value = val;
            form.period = val;
            syncFormValues();
          }
        });
      });

      $('#quickPeriodSelect')?.addEventListener('change', ev => {
        const val = ev.target.value;
        if (val) {
          const input = $('#fieldPeriod');
          if (input) input.value = val;
          form.period = val;
          syncFormValues();
          ev.target.value = '';
        }
      });

      document.querySelectorAll('.quick-amt-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const amt = btn.dataset.setAmount;
          if (amt) {
            const input = $('#fieldTotalAmount');
            if (input) input.value = amt;
            form.totalAmountMinor = Number(amt) * 100;
            updateSummary();
          }
        });
      });

      $('#fieldRuleId')?.addEventListener('change', ev => {
        form.ruleId = ev.target.value;
        const r = availableRules.find(item => item.id === form.ruleId);
        const hint = $('#ruleInfoHint');
        if (hint && r) {
          hint.innerHTML = `
            ${r.referenceBudgetMinor != null ? `参考预算: <b>${formatMoney(r.referenceBudgetMinor, r.currency || 'EGP')}</b>` : '参考预算: 待定'}
            ${r.unitAmountMinor != null ? ` · 固定金额: <b>${formatMoney(r.unitAmountMinor, r.currency || 'EGP')}</b>` : ''}
            ${r.criteria ? ` · 标准: ${esc(r.criteria)}` : ''}
          `;
        }
        if (r && r.currency && !isEdit) {
          form.currency = r.currency;
          const currSelect = $('#fieldCurrency');
          if (currSelect) {
            currSelect.value = r.currency;
            currSelect.dispatchEvent(new Event('change'));
          }
        }
      });

      $('#fieldCurrency')?.addEventListener('change', ev => {
        form.currency = ev.target.value || 'EGP';
        renderAllocations();
      });

      $('#fieldTotalAmount')?.addEventListener('input', () => {
        form.totalAmountMinor = minor($('#fieldTotalAmount').value);
        updateSummary();
      });

      $('#fieldTotalAmount')?.addEventListener('change', () => {
        const val = Math.round(Number($('#fieldTotalAmount').value || 0));
        $('#fieldTotalAmount').value = val > 0 ? val : '';
        form.totalAmountMinor = val * 100;
        updateSummary();
      });

      let attInputTimer = null;
      function handleRowAttCheck(target) {
        const tr = target.closest('tr');
        if (!tr) return;
        const nameInput = tr.querySelector('[data-key="member-name"], [data-key="name"]');
        const staffInput = tr.querySelector('[data-key="member-staffId"], [data-key="staffId"]');
        const indicator = tr.querySelector('.att-check-indicator');
        if (indicator) {
          updateAttendanceIndicator(indicator, staffInput?.value, nameInput?.value);
        }
      }

      $('#allocationContainer')?.addEventListener('input', ev => {
        syncFormValues();
        updateSummary();
        const target = ev.target;
        if (target && (target.dataset.key === 'member-name' || target.dataset.key === 'member-staffId' || target.dataset.key === 'name' || target.dataset.key === 'staffId')) {
          clearTimeout(attInputTimer);
          attInputTimer = setTimeout(() => handleRowAttCheck(target), 350);
        }
      });

      $('#allocationContainer')?.addEventListener('blur', ev => {
        const target = ev.target;
        if (target && (target.dataset.key === 'member-name' || target.dataset.key === 'member-staffId' || target.dataset.key === 'name' || target.dataset.key === 'staffId')) {
          handleRowAttCheck(target);
        }
      }, true);

      $('#allocationContainer')?.addEventListener('click', ev => {
        const target = ev.target;
        const addTeamBtn = target.closest('#btnAddTeam');
        const addRecBtn = target.closest('#btnAddRecipient');
        const isSplitEqual = target.id === 'btnSplitEqual' || target.closest('#btnSplitEqual');
        const presetBtn = target.closest('[data-preset-pcts]');
        const splitTeamBtn = target.closest('[data-split-team]');
        const rowPctBtn = target.closest('[data-row-pct]');
        const fillRemBtn = target.closest('[data-fill-rem]');
        const delTeamBtn = target.closest('[data-del-team]');
        const addMemberBtn = target.closest('[data-add-member]');
        const delMemberBtn = target.closest('[data-del-member]');
        const delRecBtn = target.closest('[data-del-rec]');
        if (addTeamBtn) {
          syncFormValues();
          form.teams.push({ name: '', mode: 'amount', amountMinor: 0, members: [{ name: '', staffId: '', mode: 'amount', amountMinor: 0 }] });
          renderAllocations();
          return;
        }

        if (addRecBtn) {
          syncFormValues();
          form.recipients.push({ name: '', staffId: '', team: '', mode: 'amount', amountMinor: 0 });
          renderAllocations();
          return;
        }

        const addRecsCountBtn = target.closest('[data-add-recipients-count]');
        if (addRecsCountBtn) {
          syncFormValues();
          const count = Number(addRecsCountBtn.dataset.addRecipientsCount) || 5;
          if (!Array.isArray(form.recipients)) form.recipients = [];
          for (let k = 0; k < count; k++) {
            form.recipients.push({ name: '', staffId: '', team: '', mode: 'amount', amountMinor: 0 });
          }
          renderAllocations();
          toast(`已批量添加 ${count} 位获奖对象`);
          return;
        }

        const batchAddRecsBtn = target.closest('#btnBatchAddRecipients');
        if (batchAddRecsBtn) {
          syncFormValues();
          openBatchAddCountDialog({
            title: '批量添加获奖对象',
            subject: '获奖对象',
            max: 50,
            defaultCount: 5,
            onConfirm: count => {
              syncFormValues();
              if (!Array.isArray(form.recipients)) form.recipients = [];
              for (let k = 0; k < count; k++) {
                form.recipients.push({ name: '', staffId: '', team: '', mode: 'amount', amountMinor: 0 });
              }
              renderAllocations();
              toast(`已批量添加 ${count} 位获奖对象`);
            }
          });
          return;
        }

        if (isSplitEqual) {
          syncFormValues();
          const totalUnits = Math.round(Number(form.totalAmountMinor || 0) / 100);
          if (totalUnits <= 0) { toast('请先填写奖励总额'); return; }
          if (category === 'bounty') {
            const allMembers = form.teams.flatMap(t => t.members || []);
            const n = allMembers.length;
            if (!n) return;
            const base = Math.floor(totalUnits / n);
            const rem = totalUnits - base * n;
            allMembers.forEach((m, k) => {
              m.amountMinor = (base + (k < rem ? 1 : 0)) * 100;
            });
          } else {
            const n = form.recipients.length;
            if (!n) return;
            const base = Math.floor(totalUnits / n);
            const rem = totalUnits - base * n;
            form.recipients.forEach((r, k) => {
              r.amountMinor = (base + (k < rem ? 1 : 0)) * 100;
            });
          }
          renderAllocations();
          return;
        }

        if (presetBtn) {
          syncFormValues();
          const totalUnits = Math.round(Number(form.totalAmountMinor || 0) / 100);
          if (totalUnits <= 0) { toast('请先填写奖励总额'); return; }
          try {
            const pcts = JSON.parse(presetBtn.dataset.presetPcts);
            if (category === 'bounty') {
              const allMembers = form.teams.flatMap(t => t.members || []);
              let allocated = 0;
              allMembers.forEach((m, k) => {
                if (k < allMembers.length - 1) {
                  const amt = Math.round(totalUnits * (pcts[k] || 0) / 100);
                  m.amountMinor = amt * 100;
                  allocated += amt;
                } else {
                  m.amountMinor = Math.max(0, totalUnits - allocated) * 100;
                }
              });
            } else {
              let allocated = 0;
              form.recipients.forEach((r, k) => {
                if (k < form.recipients.length - 1) {
                  const amt = Math.round(totalUnits * (pcts[k] || 0) / 100);
                  r.amountMinor = amt * 100;
                  allocated += amt;
                } else {
                  r.amountMinor = Math.max(0, totalUnits - allocated) * 100;
                }
              });
            }
            renderAllocations();
          } catch (e) {}
          return;
        }

        if (splitTeamBtn) {
          syncFormValues();
          const ti = Number(splitTeamBtn.dataset.splitTeam);
          const t = form.teams[ti];
          if (!t || !t.members || t.members.length < 2) return;
          let teamUnits = Math.round(Number(t.amountMinor || 0) / 100);
          if (teamUnits <= 0) {
            const totalUnits = Math.round(Number(form.totalAmountMinor || 0) / 100);
            teamUnits = Math.round(totalUnits / form.teams.length);
          }
          const n = t.members.length;
          const base = Math.floor(teamUnits / n);
          const rem = teamUnits - base * n;
          t.members.forEach((m, k) => {
            m.amountMinor = (base + (k < rem ? 1 : 0)) * 100;
          });
          renderAllocations();
          return;
        }

        if (rowPctBtn || fillRemBtn) {
          syncFormValues();
          const totalUnits = Math.round(Number(form.totalAmountMinor || 0) / 100);
          if (totalUnits <= 0) { toast('请先填写奖励总额'); return; }

          if (category === 'bounty') {
            const btn = rowPctBtn || fillRemBtn;
            const ti = Number(btn.dataset.teamIdx);
            const mi = Number(btn.dataset.memberIdx);
            if (rowPctBtn) {
              const val = Math.round(totalUnits * Number(rowPctBtn.dataset.rowPct) / 100);
              form.teams[ti].members[mi].amountMinor = val * 100;
            } else if (fillRemBtn) {
              let otherUnits = 0;
              form.teams.forEach((t, i) => {
                (t.members || []).forEach((m, j) => {
                  if (i !== ti || j !== mi) {
                    otherUnits += Math.round(Number(m.amountMinor || 0) / 100);
                  }
                });
              });
              const rem = Math.max(0, totalUnits - otherUnits);
              form.teams[ti].members[mi].amountMinor = rem * 100;
            }
          } else {
            const btn = rowPctBtn || fillRemBtn;
            const ri = Number(btn.dataset.recIdx);
            if (rowPct != null) {
              const val = Math.round(totalUnits * Number(rowPct) / 100);
              form.recipients[ri].amountMinor = val * 100;
            } else if (fillRem != null) {
              let otherUnits = 0;
              form.recipients.forEach((r, i) => {
                if (i !== ri) {
                  otherUnits += Math.round(Number(r.amountMinor || 0) / 100);
                }
              });
              const rem = Math.max(0, totalUnits - otherUnits);
              form.recipients[ri].amountMinor = rem * 100;
            }
          }
          renderAllocations();
          return;
        }

        if (addMemberBtn) {
          syncFormValues();
          const ti = Number(addMemberBtn.dataset.addMember);
          if (form.teams && form.teams[ti]) {
            if (!Array.isArray(form.teams[ti].members)) form.teams[ti].members = [];
            form.teams[ti].members.push({ name: '', staffId: '', mode: 'amount', amountMinor: 0 });
            renderAllocations();
          }
          return;
        }

        const addMembersCountBtn = target.closest('[data-add-members-count]');
        if (addMembersCountBtn) {
          syncFormValues();
          const [tiStr, countStr] = addMembersCountBtn.dataset.addMembersCount.split(':');
          const ti = Number(tiStr);
          const count = Number(countStr) || 5;
          if (form.teams && form.teams[ti]) {
            if (!Array.isArray(form.teams[ti].members)) form.teams[ti].members = [];
            for (let k = 0; k < count; k++) {
              form.teams[ti].members.push({ name: '', staffId: '', mode: 'amount', amountMinor: 0 });
            }
            renderAllocations();
            toast(`已为团队批量添加 ${count} 位成员`);
          }
          return;
        }

        const addMembersCustomBtn = target.closest('[data-add-members-custom]');
        if (addMembersCustomBtn) {
          syncFormValues();
          const ti = Number(addMembersCustomBtn.dataset.addMembersCustom);
          const teamName = form.teams[ti]?.name || `团队 ${ti + 1}`;
          openBatchAddCountDialog({
            title: `批量添加成员 · ${teamName}`,
            subject: '成员',
            max: 50,
            defaultCount: 5,
            onConfirm: count => {
              syncFormValues();
              if (form.teams && form.teams[ti]) {
                if (!Array.isArray(form.teams[ti].members)) form.teams[ti].members = [];
                for (let k = 0; k < count; k++) {
                  form.teams[ti].members.push({ name: '', staffId: '', mode: 'amount', amountMinor: 0 });
                }
                renderAllocations();
                toast(`已为【${teamName}】批量添加 ${count} 位成员`);
              }
            }
          });
          return;
        }

        if (delMemberBtn) {
          syncFormValues();
          const [ti, mi] = (delMemberBtn.dataset.delMember || '').split('-').map(Number);
          if (form.teams && form.teams[ti] && form.teams[ti].members) {
            if (form.teams[ti].members.length > 1) {
              form.teams[ti].members.splice(mi, 1);
            } else {
              form.teams[ti].members[0] = { name: '', staffId: '', mode: 'amount', amountMinor: 0 };
            }
            renderAllocations();
          }
          return;
        }

        if (delTeamBtn) {
          syncFormValues();
          const ti = Number(delTeamBtn.dataset.delTeam);
          if (form.teams.length > 1) {
            form.teams.splice(ti, 1);
          } else {
            form.teams = [{ name: '', mode: 'amount', amountMinor: 0, members: [{ name: '', staffId: '', mode: 'amount', amountMinor: 0 }] }];
          }
          renderAllocations();
          return;
        }

        if (delRecBtn) {
          syncFormValues();
          const ri = Number(delRecBtn.dataset.delRec);
          if (form.recipients.length > 1) {
            form.recipients.splice(ri, 1);
          } else {
            form.recipients = [{ name: '', staffId: '', team: '', mode: 'amount', amountMinor: 0 }];
          }
          renderAllocations();
          return;
        }
      });

      $('#fieldAttachmentInput')?.addEventListener('change', ev => {
        const files = Array.from(ev.target.files || []);
        if (!files.length) return;
        const maxSize = 15 * 1024 * 1024;
        for (const f of files) {
          if (f.size > maxSize) {
            toast(`文件 "${f.name}" 超过 15MB 限制，请重新选择`);
            continue;
          }
          pendingFiles.push(f);
        }
        ev.target.value = '';
        renderFormAttachments();
      });

      $('#formAttachmentList')?.addEventListener('click', ev => {
        const previewPendingBtn = ev.target.closest('[data-pending-preview-idx]');
        const delAttachBtn = ev.target.closest('[data-del-attach-idx]');
        const delPendingBtn = ev.target.closest('[data-del-pending-idx]');
        if (previewPendingBtn) {
          const idx = Number(previewPendingBtn.dataset.pendingPreviewIdx);
          const f = pendingFiles[idx];
          if (f) {
            const objUrl = URL.createObjectURL(f);
            openAttachmentModal(objUrl, f.name);
          }
        } else if (delAttachBtn) {
          const idx = Number(delAttachBtn.dataset.delAttachIdx);
          form.attachments.splice(idx, 1);
          renderFormAttachments();
        } else if (delPendingBtn) {
          const idx = Number(delPendingBtn.dataset.delPendingIdx);
          pendingFiles.splice(idx, 1);
          renderFormAttachments();
        }
      });

      async function uploadPendingFiles() {
        if (!pendingFiles.length) return;
        for (const file of pendingFiles) {
          const fd = new FormData();
          fd.append('file', file);
          const res = await fetch('/api/reward-program/evidence', {
            method: 'POST',
            credentials: 'same-origin',
            body: fd
          });
          const json = await res.json();
          if (!res.ok) throw new Error(json.error || `附件 "${file.name}" 上传失败`);
          form.attachments.push(json.path);
        }
        pendingFiles = [];
      }

      $('#btnSaveDraft')?.addEventListener('click', async () => {
        syncFormValues();
        try {
          if (!form.title) { toast('请填写申请标题'); return; }
          await uploadPendingFiles();
          let saved;
          if (record) {
            saved = await api(`/applications/${record.id}/save`, 'POST', { ...form, revision: record.revision });
          } else {
            saved = await api('/applications', 'POST', form);
          }
          $('#modalHost').innerHTML = '';
          await load();
          toast('草稿已保存');
        } catch (err) {
          toast(err.message);
        }
      });

      $('#appForm')?.addEventListener('submit', async ev => {
        ev.preventDefault();
        syncFormValues();
        try {
          await uploadPendingFiles();
          let saved = record;
          if (!saved) {
            saved = await api('/applications', 'POST', form);
          } else {
            saved = await api(`/applications/${saved.id}/save`, 'POST', { ...form, revision: saved.revision });
          }

          if (saved.status === 'draft' || saved.status === 'returned') {
            await api(`/applications/${saved.id}/publish`, 'POST', { revision: saved.revision });
          }
          $('#modalHost').innerHTML = '';
          await load();
          toast('奖励申报已正式发布');
        } catch (err) {
          toast(err.message);
        }
      });
    }

    renderFormContent();
  }

      $('#modalHost').innerHTML = `

          return;

            ).join('');
            confirmDialog({
              title: '删除规则确认',
              message: `奖项规则【${rule.name}】当前正被以下 ${usingApps.length} 条申报记录使用：`,

              isHtmlNote: true,
              confirmText: '确认删除',

              title: '删除规则确认',
              message: `确定要删除奖项规则【${rule.name}】吗？`,
              note: '当前暂无申报记录使用该规则。删除后将无法恢复，且不可再用于发起新申报。',
              confirmText: '确认删除',
              confirmClass: 'danger',
              onConfirm: async () => {
                try {
                  await api(`/rules/${encodeURIComponent(rule.id)}`, 'DELETE');
                  await load();
                  toast('规则已成功删除');
                  openRulesDialog();
                } catch (err) {
                  toast(err.message);
                }
              }
            });
          }
        }
      });
    }

    renderContent();
  }

                <label class="field">
                  <span id="rUnitAmountLabel">单人固定金额 (${curr})</span>
                  <input type="number" step="1" min="0" id="rUnitAmount" value="${v.unitAmountMinor != null ? Math.round(Number(v.unitAmountMinor) / 100) : ''}" placeholder="请输入整数金额">
                </label>
              ` : ''}

              <label class="field"><span>评选 / 激励标准</span><textarea id="rCriteria" rows="3">${esc(v.criteria || '')}</textarea></label>
            </div>
            <div class="modal-foot">
              <button type="button" class="btn" id="closeModal">取消</button>
              <button type="submit" class="btn primary">保存规则</button>
            </div>
          </form>
        </div>
      </div>
    `;

    $('#rCurrency')?.addEventListener('change', ev => {
      const selectedCurr = ev.target.value;
      if ($('#rBudgetLabel')) $('#rBudgetLabel').textContent = `参考预算 (${selectedCurr})`;
      if ($('#rUnitAmountLabel')) $('#rUnitAmountLabel').textContent = `单人固定金额 (${selectedCurr})`;
    });

    $('#ruleForm').addEventListener('submit', async ev => {
      ev.preventDefault();
      const body = {
        category: v.category,
        name: $('#rName').value.trim(),
        cycle: $('#rCycle').value.trim(),
        recipientType: v.recipientType,
        positionName: $('#rPosition')?.value.trim() || '',
        currency: $('#rCurrency')?.value === 'CNY' ? 'CNY' : 'EGP',
        unitAmountMinor: $('#rUnitAmount')?.value ? minor($('#rUnitAmount').value) : null,
        referenceBudgetMinor: $('#rBudget')?.value ? minor($('#rBudget').value) : null,
        criteria: $('#rCriteria').value.trim(),
        approvalFlow: v.approvalFlow || ['department', 'at', 'publicity']
      };
      try {
        const id = rule?.id || `rule-${Date.now()}-${Math.random().toString(36).slice(2)}`;
        await api(`/rules/${id}`, 'PUT', body);
        $('#modalHost').innerHTML = '';
        await load();
        toast('规则已保存');
        openRulesDialog();
      } catch (err) {
        toast(err.message);
      }
    });
  }

  // ================= 确认弹窗与动作处理 (Confirm Dialog & Actions) =================

  function alertDialog({ title, message = '', note = '', isHtmlNote = false, btnText = '知道了', icon = 'ℹ️' }) {
    $('#modalHost').innerHTML = `
      <div class="modal-backdrop">
        <div class="modal" style="width:min(520px,100%)">
          <div class="modal-head">
            <h2 style="display:flex;align-items:center;gap:8px"><span>${icon}</span><span>${esc(title)}</span></h2>
            <button type="button" class="modal-close-btn" id="closeModal">×</button>
          </div>
          <div class="modal-body">
            ${message ? `<div style="font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.6">${esc(message)}</div>` : ''}
            ${note ? `<div style="font-size:13px;color:var(--ink);background:var(--bg);padding:12px 14px;border-radius:8px;border:1px solid var(--line);margin-top:8px;white-space:pre-wrap;line-height:1.6">${isHtmlNote ? note : esc(note)}</div>` : ''}
          </div>
          <div class="modal-foot" style="justify-content:flex-end">
            <button type="button" class="btn primary" id="alertOkBtn">${esc(btnText)}</button>
          </div>
        </div>
      </div>
    `;

    $('#closeModal')?.addEventListener('click', () => {
      $('#modalHost').innerHTML = '';
    });

    $('#alertOkBtn')?.addEventListener('click', () => {
      $('#modalHost').innerHTML = '';
    });
  }

  function confirmDialog({ title, message, note = '', isHtmlNote = false, confirmText = '确认', confirmClass = 'primary', onConfirm }) {
    $('#modalHost').innerHTML = `
      <div class="modal-backdrop">
        <div class="modal" style="width:min(520px,100%)">
          <div class="modal-head">
            <h2>${esc(title)}</h2>
            <button type="button" class="modal-close-btn" id="closeModal">×</button>
          </div>
          <div class="modal-body">
            <div style="font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.6">${esc(message)}</div>
            ${note ? `<div style="font-size:12.5px;color:var(--muted);background:var(--bg);padding:10px 14px;border-radius:8px;border:1px solid var(--line);margin-top:8px">${isHtmlNote ? note : esc(note)}</div>` : ''}
          </div>
          <div class="modal-foot">
            <button type="button" class="btn" id="confirmCancelBtn">取消</button>
            <button type="button" class="btn ${confirmClass}" id="confirmOkBtn">${esc(confirmText)}</button>
          </div>
        </div>
      </div>
    `;

    $('#confirmCancelBtn')?.addEventListener('click', () => {
      $('#modalHost').innerHTML = '';
    });

    $('#confirmOkBtn')?.addEventListener('click', async () => {
      $('#modalHost').innerHTML = '';
      if (onConfirm) await onConfirm();
    });
  }

  function publishRecord(item) {
    confirmDialog({
      title: '确认正式发布',
      message: `确认正式发布【${item.title || '该申报'}】吗？`,
      note: '发布后该奖励记录将正式生效，并在全员/公示范围可见。',
      confirmText: '确认发布',
      confirmClass: 'primary',
      onConfirm: async () => {
        try {
          await api(`/applications/${item.id}/publish`, 'POST', { revision: item.revision });
          await load();
          toast('奖励记录已正式发布');
        } catch (err) {
          toast(err.message);
        }
      }
    });
  }

  function archiveRecord(item) {
    confirmDialog({
      title: '确认归档记录',
      message: `确认将【${item.title || '该记录'}】归档封存吗？`,
      note: '归档后记录将移入已归档列表，管理员可随时恢复。',
      confirmText: '确认归档',
      confirmClass: 'primary',
      onConfirm: async () => {
        try {
          await api(`/applications/${item.id}/archive`, 'POST', { revision: item.revision });
          await load();
          toast('记录已归档');
        } catch (err) {
          toast(err.message);
        }
      }
    });
  }

  function unarchiveRecord(item) {
    confirmDialog({
      title: '确认恢复发布',
      message: `确认恢复【${item.title || '该记录'}】为已发布状态吗？`,
      note: '恢复后记录将重新回到活跃已发布列表。',
      confirmText: '确认恢复',
      confirmClass: 'primary',
      onConfirm: async () => {
        try {
          await api(`/applications/${item.id}/unarchive`, 'POST', { revision: item.revision });
          await load();
          toast('记录已恢复发布');
        } catch (err) {
          toast(err.message);
        }
      }
    });
  }

  function deleteRecord(item) {
    confirmDialog({
      title: '删除草稿',
      message: `确定删除草稿【${item.title || '未命名草稿'}】吗？`,
      note: '⚠️ 此操作不可撤销，草稿删除后无法找回。',
      confirmText: '确认删除',
      confirmClass: 'danger',
      onConfirm: async () => {
        try {
          await api(`/applications/${item.id}`, 'DELETE');
          await load();
          toast('草稿已删除');
        } catch (err) {
          toast(err.message);
        }
      }
    });
  }

  function exportCsv() {
    const list = getFilteredRecords();
    const rows = [
      ['奖项类别', '奖项规则', '申请标题', '周期批次', '项目名称', '币种', '总金额', '申报人', '状态', '获奖对象明细', '事迹说明', '更新时间'],
      ...list.map(a => {
        const rule = state.rules.find(r => r.id === a.ruleId);
        const st = statusMap[a.status] || { label: a.status };
        const curr = a.currency || 'EGP';
        const recipients = a.category === 'bounty'
          ? (a.teams || []).map(t => `${t.name}：${(t.members || []).map(m => `${m.name}(${formatMoney(m.amountMinor, curr)})`).join('、')}`).join('；')
          : (a.recipients || []).map(r => `${r.name}(${formatMoney(r.amountMinor, curr)})`).join('、');
        return [
          cats[a.category]?.[1] || a.category,
          rule?.name || a.ruleId,
          a.title,
          a.period,
          a.projectName || '',
          curr,
          a.totalAmountMinor != null ? Math.round(Number(a.totalAmountMinor) / 100) : '',
          a.applicant,
          st.label,
          recipients,
          a.summary,
          (a.updatedAt || '').slice(0, 10)
        ];
      })
    ];

    const csvCell = v => `"${(/^[\s]*[=+\-@]/.test(String(v ?? '')) ? "'" : '') + String(v ?? '').replace(/"/g, '""')}"`;
    const content = '\uFEFF' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
    const blob = new Blob([content], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `奖励清单-${state.category}-${new Date().toISOString().slice(0, 10)}.csv`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // ================= 全局事件监听 =================

  document.addEventListener('click', ev => {
    if (ev.target.id === 'closeModal' || ev.target.closest('#closeModal')) {
      $('#modalHost').innerHTML = '';
      return;
    }

    const tab = ev.target.closest('[data-tab]');
    if (tab) {
      state.category = tab.dataset.tab;
      state.filter = 'all';
      render();
      return;
    }

    const stat = ev.target.closest('[data-filter]');
    if (stat) {
      state.filter = stat.dataset.filter;
      render();
      return;
    }

    const actionBtn = ev.target.closest('[data-action]');
    if (actionBtn) {
      const id = actionBtn.dataset.id;
      const action = actionBtn.dataset.action;
      const item = state.applications.find(a => a.id === id);
      if (!item) return;

      if (action === 'detail') openDetailDialog(item);
      else if (action === 'edit') openFormDialog(item);
      else if (action === 'publish') publishRecord(item);
      else if (action === 'revoke') openRevokeDialog(item);
      else if (action === 'archive') archiveRecord(item);
      else if (action === 'unarchive') unarchiveRecord(item);
      else if (action === 'delete') deleteRecord(item);
      return;
    }

    const row = ev.target.closest('.record-row');
    if (row && !ev.target.closest('.cell-actions')) {
      const item = state.applications.find(a => a.id === row.dataset.id);
      if (item) openDetailDialog(item);
    }
  });

  $('#btnNewApplication')?.addEventListener('click', () => openFormDialog());
  $('#btnManageRules')?.addEventListener('click', () => openRulesDialog());
  $('#btnExportCsv')?.addEventListener('click', () => exportCsv());
  $('#btnClearFilter')?.addEventListener('click', () => {
    state.filter = 'all';
    state.search = '';
    $('#searchInput').value = '';
    render();
  });

  $('#searchInput')?.addEventListener('input', ev => {
    state.search = ev.target.value.trim();
    renderTable();
  });

  document.addEventListener('click', ev => {
    const previewTrigger = ev.target.closest('[data-preview-url]');
    if (previewTrigger) {
      ev.preventDefault();
      ev.stopPropagation();
      openAttachmentModal(previewTrigger.dataset.previewUrl, previewTrigger.dataset.previewTitle || '证明材料原件预览');
    }
  });

  window.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') {
      const host = $('#attachModalHost');
      if (host && host.innerHTML.trim()) {
        host.innerHTML = '';
        ev.stopPropagation();
      }
    }
  });

  document.addEventListener('click', ev => {
    const badge = ev.target.closest('.att-badge.anomaly');
    if (badge && badge.dataset.details) {
      alertDialog({
        title: '会议考勤异常记录明细',
        icon: '⚠️',
        message: '该成员在历史会议考勤快照中检索到以下异常情况：',
        note: badge.dataset.details
      });
    }
  });

  load();
})();
</script>
</body>
