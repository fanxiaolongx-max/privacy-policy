<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>供应商报价比价</title>
  <style>
    :root{--bg:#f3f6fb;--card:#fff;--text:#172033;--muted:#667085;--line:#dce3ee;--primary:#175cd3;--primary-soft:#eaf2ff;--success:#067647;--success-soft:#ecfdf3;--warning:#b54708;--warning-soft:#fffaeb;--danger:#b42318;--danger-soft:#fef3f2;--shadow:0 10px 30px rgba(16,24,40,.07);--radius:16px}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 5% 0,rgba(23,92,211,.08),transparent 28%),var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.page{width:min(1680px,calc(100% - 28px));margin:auto;padding:24px 0 48px}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:18px}.hero h1{font-size:clamp(26px,3vw,40px);line-height:1.1;margin:0}.hero p{color:var(--muted);margin:8px 0 0}.privacy{color:var(--success);background:var(--success-soft);border:1px solid #abefc6;padding:7px 11px;border-radius:999px;font-weight:700;white-space:nowrap}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.card+.card{margin-top:16px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.section-title h2{font-size:18px;margin:0}.muted{color:var(--muted)}.upload{display:grid;place-items:center;min-height:170px;border:2px dashed #9db7df;border-radius:14px;background:linear-gradient(145deg,#f8fbff,#f5f8fc);text-align:center;padding:24px;cursor:pointer;transition:.2s}.upload.drag{border-color:var(--primary);background:var(--primary-soft);transform:translateY(-1px)}.upload strong{font-size:18px}.upload input{display:none}.btns{display:flex;flex-wrap:wrap;gap:8px}.btn{border:0;border-radius:9px;padding:9px 13px;background:#edf1f7;color:#344054;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.btn:hover{filter:brightness(.97)}.btn.primary{background:var(--primary);color:#fff}.btn.success{background:#067647;color:#fff}.btn.danger{background:var(--danger-soft);color:var(--danger)}.btn:disabled{opacity:.45;cursor:not-allowed}.status{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--primary-soft);color:#1849a9}.status.show{display:block}.status.error{background:var(--danger-soft);color:var(--danger)}.status.success{background:var(--success-soft);color:var(--success)}.settings{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px}.field label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;height:38px;border:1px solid #c9d2e1;border-radius:8px;background:var(--card);color:var(--text);padding:0 9px}.sheet-list{display:grid;gap:10px}.sheet-card{border:1px solid var(--line);border-radius:12px;overflow:hidden}.sheet-head{display:grid;grid-template-columns:minmax(150px,1.2fr) 130px minmax(140px,1fr) 110px 120px;gap:8px;align-items:end;padding:12px;background:#f8fafc}.sheet-map{display:grid;grid-template-columns:repeat(7,minmax(115px,1fr));gap:8px;padding:12px;border-top:1px solid var(--line)}.sheet-card[data-role="ignore"] .sheet-map,.sheet-card[data-role="base"] .supplier-only{opacity:.42;pointer-events:none}.preview{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:12px}.compare{border-collapse:separate;border-spacing:0;min-width:1100px;width:max-content}.compare th,.compare td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 9px;vertical-align:top;max-width:260px}.compare th{position:sticky;top:0;z-index:3;background:#eaf2ff;text-align:left;white-space:nowrap}.compare thead tr:first-child th{top:0;text-align:center;font-size:13px}.compare thead tr:nth-child(2) th{top:37px}.compare tbody tr:hover td{filter:brightness(.985)}.compare td[style*="background"]{color:#172033}.compare td[style*="background"] .small{color:#667085}.compare select,.compare input{max-width:220px;width:100%;border:1px solid #c9d2e1;border-radius:7px;background:rgba(255,255,255,.74);color:#172033;padding:6px}.compare .reason{min-width:250px}.quote-value{font-weight:800;font-variant-numeric:tabular-nums;margin-top:5px}.small{font-size:12px;color:var(--muted)}.warn{color:var(--warning);font-weight:700}.missing{color:var(--danger)}.badge{display:inline-block;border-radius:999px;padding:2px 7px;font-size:11px;font-weight:800;background:#eef2f6;color:#475467}.badge.good{background:var(--success-soft);color:var(--success)}.summary{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}.metric{min-width:140px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#f8fafc}.metric b{display:block;font-size:21px}.empty{text-align:center;padding:44px 20px;color:var(--muted)}.hidden{display:none!important}@media(max-width:900px){.hero{align-items:flex-start;flex-direction:column}.settings{grid-template-columns:repeat(2,1fr)}.sheet-head{grid-template-columns:1fr 1fr}.sheet-map{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.page{width:min(100% - 16px,1680px);padding-top:14px}.card{padding:13px}.settings,.sheet-map{grid-template-columns:1fr}.sheet-head{grid-template-columns:1fr}.privacy{white-space:normal}}@media(prefers-color-scheme:dark){:root{--bg:#0f1725;--card:#172033;--text:#edf2f8;--muted:#a8b2c1;--line:#344054;--primary-soft:#142e56;--success-soft:#12382c;--warning-soft:#3b2a12;--danger-soft:#411c1c;--shadow:none}.upload,.sheet-head,.metric{background:#1b2638}.field input,.field select{background:#111a29}.compare select,.compare input{background:rgba(17,26,41,.85);color:#edf2f8}.compare th{background:#18345d}.compare tbody tr:hover td{filter:brightness(1.07)}}
  </style>
  <style>
    .sheet-card[data-role="supplier"] .base-only,
    .sheet-card[data-role="ignore"] .base-only{opacity:.42;pointer-events:none}
    .compare-status{display:inline-block;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800;white-space:nowrap}
    .compare-status.same{background:#dcfae6;color:#067647}
    .compare-status.different{background:#fee4e2;color:#b42318}
    .compare-status.missing-base,.compare-status.missing-recommendation{background:#fef0c7;color:#b54708}
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div><h1>供应商报价比价</h1><p>以 Week1 需求表为基础，自动匹配各供应商报价、单位、规格和备注，并生成可导出的比价表。</p></div>
      <div class="privacy">文件仅在当前浏览器中处理</div>
    </header>

    <section class="card" id="uploadCard">
      <div class="section-title"><h2>1. 导入报价文件</h2><button class="btn" id="sampleBtn" type="button">加载示例</button></div>
      <label class="upload" id="dropZone">
        <input id="fileInput" type="file" accept=".xlsx,.xls,.xlsm,.xlsb,.csv,.tsv">
        <span><strong>点击选择或拖入 Excel 报价表</strong><br><span class="muted">支持 .xlsx / .xls / .xlsm / .xlsb / .csv / .tsv；默认识别 Week1 为基础表</span></span>
      </label>
      <div class="status" id="status" role="status"></div>
    </section>

    <section class="card hidden" id="configCard">
      <div class="section-title"><div><h2>2. 确认表格和字段</h2><div class="muted">系统已自动识别；如果原表格式变化，可在生成前手动调整。</div></div><button class="btn primary" id="generateBtn" type="button">生成比价表</button></div>
      <div class="settings">
        <div class="field"><label for="taxRate">默认税率（%）</label><input id="taxRate" type="number" min="0" max="100" step="0.1" value="14"></div>
        <div class="field"><label for="matchThreshold">自动匹配阈值</label><input id="matchThreshold" type="number" min="0.3" max="1" step="0.01" value="0.58"></div>
        <div class="field"><label for="exportName">导出文件名</label><input id="exportName" type="text" value="供应商比价表"></div>
        <div class="field"><label>报价原则</label><input value="优先税后价；税前价按设定税率折算" disabled></div>
      </div>
      <div class="sheet-list" id="sheetList" style="margin-top:14px"></div>
    </section>

    <section class="card hidden" id="resultCard">
      <div class="section-title"><div><h2>3. 比价结果</h2><div class="muted">报价下拉框可人工更换匹配商品；推荐供应商和理由也可修改。</div></div><div class="btns"><button class="btn" id="regenerateBtn" type="button">重新计算推荐</button><button class="btn success" id="exportBtn" type="button">导出带颜色的 Excel</button></div></div>
      <div class="summary" id="summary"></div>
      <div class="preview" id="preview"><div class="empty">请先生成比价表</div></div>
    </section>
  </main>
  <script src="/js/shared/xlsx.full.min.js"></script>
  <script src="/js/shared/jszip.min.js"></script>
  <script src="./comparison-core.js"></script>
  <script src="./app.js"></script>
</body>
</html>
