<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>题库学习与 Excel 转换</title>
  <script src="/js/shared/xlsx.full.min.js"></script>
  <style>
    :root{--navy:#0b2b5b;--blue:#2563eb;--pale:#f3f7fc;--line:#dbe5f1;--text:#172033;--muted:#64748b;--green:#15803d;--amber:#b45309;--red:#b91c1c}
    *{box-sizing:border-box}body{margin:0;background:var(--pale);color:var(--text);font:14px/1.55 "Segoe UI","Microsoft YaHei",sans-serif}
    header{background:linear-gradient(125deg,#071f46,#174f91);color:#fff;padding:30px max(24px,calc((100vw - 1320px)/2));box-shadow:0 5px 20px #0b2b5b33}
    header h1{margin:0 0 6px;font-size:26px}header p{margin:0;color:#dbeafe}.header-inner{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.lang-btn{border:1px solid #ffffff88;background:#ffffff18;color:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700;white-space:nowrap}.wrap{max-width:1320px;margin:22px auto;padding:0 20px 40px}
    .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 18px #1e3a5f0d;padding:18px;margin-bottom:16px}
    .drop{border:2px dashed #93b4da;text-align:center;padding:30px;border-radius:12px;background:#f8fbff;transition:.2s;cursor:pointer}.drop.drag{border-color:var(--blue);background:#eaf3ff}.drop strong{font-size:17px;color:var(--navy)}
    button,.file-label,select,input{font:inherit}.btn,.file-label{border:0;border-radius:8px;padding:9px 15px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px}.primary{background:var(--blue);color:#fff}.secondary{background:#e8eef7;color:var(--navy)}.danger{background:#fee2e2;color:var(--red)}button:disabled{opacity:.45;cursor:not-allowed}
    #fileInput{display:none}.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:14px}.stats{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:10px}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px}.stat b{font-size:22px;display:block;color:var(--navy)}
    .toolbar{display:grid;grid-template-columns:minmax(220px,2fr) repeat(2,minmax(140px,1fr)) auto auto;gap:9px;align-items:center}input,select{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:9px 10px;background:#fff;color:var(--text)}
    .notice{padding:10px 12px;border-radius:8px;margin-top:12px;display:none}.notice.show{display:block}.notice.ok{background:#dcfce7;color:#166534}.notice.err{background:#fee2e2;color:#991b1b}.bank-list{margin-top:12px;color:var(--muted)}
    .question-list{display:grid;gap:12px}.question{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.qhead{display:flex;gap:9px;align-items:flex-start;padding:14px 16px;background:#fbfdff}.num{min-width:32px;height:32px;border-radius:8px;background:#e8f0fb;color:var(--navy);display:grid;place-items:center;font-weight:700}.qtext{font-size:16px;font-weight:600;flex:1}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{font-size:12px;padding:2px 7px;border-radius:999px;background:#e8eef7;color:#334155}.confirmed{background:#dcfce7;color:#166534}.pending{background:#fef3c7;color:#92400e}
    .body{padding:0 16px 15px 57px}.option{padding:6px 9px;border-radius:7px;margin:3px 0;background:#f8fafc}.answer{display:none;border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}.question.reveal .answer{display:block}.answer-row{margin:5px 0}.answer-row b{display:inline-block;min-width:90px}.correct{color:var(--green)}.guess{color:var(--amber)}.wrong{color:var(--red)}
    .qfoot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;margin-top:8px}.link-btn{border:0;background:none;color:var(--blue);cursor:pointer;font-weight:600}.empty{text-align:center;padding:65px 20px;color:var(--muted)}
    .pager{display:flex;justify-content:center;align-items:center;gap:10px;margin:18px}.pager button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 12px;cursor:pointer}
    @media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.body{padding-left:16px}.qhead{flex-wrap:wrap}}
  </style>
</head>
<body>
<header><div class="header-inner"><div><h1 id="pageTitle">📚 题库学习与 Excel 转换</h1><p id="privacyText">数据只在当前浏览器中处理，不会上传到服务器。</p></div><button class="lang-btn" id="langBtn">English</button></div></header>
<main class="wrap">
  <section class="card">
    <div class="drop" id="dropZone" tabindex="0"><strong id="dropTitle">将一个或多个题库 JSON 拖到这里</strong><br><span id="dropHelp">支持单题库数组和多题库备份包，中英文字段均可识别</span><div class="actions"><label class="file-label primary" for="fileInput" id="chooseLabel">选择 JSON 文件</label><input id="fileInput" type="file" accept=".json,application/json" multiple><button class="btn secondary" id="sampleBtn">加载示例</button><button class="btn danger" id="clearBtn" disabled>清空</button></div></div>
    <div id="notice" class="notice"></div><div id="bankList" class="bank-list"></div>
  </section>
  <section class="card stats" id="stats">
    <div class="stat"><span id="statBanks">题库</span><b id="bankCount">0</b></div><div class="stat"><span id="statTotal">题目总数</span><b id="totalCount">0</b></div><div class="stat"><span id="statConfirmed">已确认答案</span><b id="confirmedCount">0</b></div><div class="stat"><span id="statPending">待复习 / 疑似</span><b id="pendingCount">0</b></div><div class="stat"><span id="statFiltered">当前筛选</span><b id="filteredCount">0</b></div>
  </section>
  <section class="card toolbar">
    <input id="search" placeholder="搜索题目、选项或答案…">
    <select id="bankFilter"><option value="">全部题库</option></select><select id="typeFilter"><option value="">全部题型</option></select>
    <select id="answerFilter"><option value="">全部状态</option><option value="confirmed">已确认</option><option value="pending">待确认</option></select>
    <button class="btn primary" id="exportBtn" disabled>导出 Excel</button>
  </section>
  <div id="questionList" class="question-list"><div class="card empty">请先导入题库 JSON 文件</div></div><div class="pager" id="pager"></div>
</main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id); const state={banks:[],questions:[],filtered:[],page:1,pageSize:30,lang:'zh'};
  const I={zh:{title:'📚 题库学习与 Excel 转换',privacy:'数据只在当前浏览器中处理，不会上传到服务器。',drop:'将一个或多个题库 JSON 拖到这里',help:'支持单题库数组和多题库备份包，中英文字段均可识别',choose:'选择 JSON 文件',sample:'加载示例',clear:'清空',banks:'题库',total:'题目总数',confirmed:'已确认答案',pending:'待复习 / 疑似',filtered:'当前筛选',search:'搜索题目、选项或答案…',allBanks:'全部题库',allTypes:'全部题型',allStatus:'全部状态',statusConfirmed:'已确认',statusPending:'待确认',export:'导出 Excel',empty:'请先导入题库 JSON 文件',noMatch:'当前筛选条件下没有题目',loaded:'已加载',questions:'题',show:'显示答案',hide:'隐藏答案',correct:'正确答案',suggested:'疑似答案',defWrong:'明确错误',wrong:'错误答案',wrongCombo:'错误组合',original:'原题号',occurred:'出现',times:'次',prev:'上一页',next:'下一页'},en:{title:'📚 Question Bank Study & Excel Converter',privacy:'Data is processed only in this browser and is never uploaded to the server.',drop:'Drop one or more question-bank JSON files here',help:'Supports single-bank arrays and multi-bank backup packages with Chinese or English fields',choose:'Choose JSON Files',sample:'Load Sample',clear:'Clear',banks:'Question Banks',total:'Total Questions',confirmed:'Confirmed Answers',pending:'Review / Suggested',filtered:'Current Results',search:'Search questions, options, or answers…',allBanks:'All Question Banks',allTypes:'All Question Types',allStatus:'All Statuses',statusConfirmed:'Confirmed',statusPending:'Unconfirmed',export:'Export Excel',empty:'Import a question-bank JSON file to begin',noMatch:'No questions match the current filters',loaded:'Loaded',questions:'questions',show:'Show Answer',hide:'Hide Answer',correct:'Correct Answer',suggested:'Suggested Answer',defWrong:'Definitely Wrong',wrong:'Wrong Answer',wrongCombo:'Wrong Combinations',original:'Original No.',occurred:'Seen',times:'times',prev:'Previous',next:'Next'}};
  const tr=k=>I[state.lang][k];
  function applyLanguage(){document.documentElement.lang=state.lang==='zh'?'zh-CN':'en';document.title=tr('title').replace(/^📚\s*/, '');$('pageTitle').textContent=tr('title');$('privacyText').textContent=tr('privacy');$('dropTitle').textContent=tr('drop');$('dropHelp').textContent=tr('help');$('chooseLabel').textContent=tr('choose');$('sampleBtn').textContent=tr('sample');$('clearBtn').textContent=tr('clear');$('statBanks').textContent=tr('banks');$('statTotal').textContent=tr('total');$('statConfirmed').textContent=tr('confirmed');$('statPending').textContent=tr('pending');$('statFiltered').textContent=tr('filtered');$('search').placeholder=tr('search');$('answerFilter').options[0].text=tr('allStatus');$('answerFilter').options[1].text=tr('statusConfirmed');$('answerFilter').options[2].text=tr('statusPending');$('exportBtn').textContent=tr('export');$('langBtn').textContent=state.lang==='zh'?'English':'中文';renderAll()}
  const pick=(o,...keys)=>{for(const k of keys)if(o&&o[k]!==undefined&&o[k]!==null)return o[k]};
  const arr=v=>Array.isArray(v)?v.map(x=>String(x)):[];
  const typeName=v=>{const s=String(v||'').toLowerCase().replace(/[\s_-]/g,'');if(['true/false','truefalse','boolean','判断题'].includes(s))return '判断题';if(['multiplechoice','multiple','multichoice','多选题'].includes(s))return '多选题';return '单选题'};
  function normalizeQuestion(q,bank,index){
    if(!q||typeof q!=='object')throw new Error(`题库“${bank}”第 ${index+1} 题不是有效对象`);
    const text=String(pick(q,'题目','question')||'').trim(),options=pick(q,'选项','options');if(!text||!Array.isArray(options))throw new Error(`题库“${bank}”第 ${index+1} 题缺少题目或选项`);
    return {bank,id:String(pick(q,'id')||''),variantKey:String(pick(q,'variantKey')||''),type:typeName(pick(q,'题型','questionType','type')),number:Number(pick(q,'题号','questionNumber'))||index+1,question:text,options:arr(options),occurrences:Number(pick(q,'出现次数','occurrenceCount'))||1,correct:arr(pick(q,'正确答案','correctAnswers')),suggested:arr(pick(q,'猜测答案','suggestedAnswers')),suggestionCount:Number(pick(q,'猜测次数','suggestionCount'))||0,suggestionUseCount:Number(pick(q,'猜测采用次数','suggestionUseCount'))||0,suggestionUpdatedAt:String(pick(q,'猜测更新时间','suggestionUpdatedAt')||''),wrong:arr(pick(q,'错误答案','wrongAnswers')),definiteWrong:arr(pick(q,'明确错误答案','definiteWrongAnswers')),wrongCombinations:(pick(q,'错误组合','wrongCombinations')||[]).filter(Array.isArray).map(arr)};
  }
  function unpack(data,fileName){
    if(Array.isArray(data))return [{name:fileName.replace(/\.json$/i,''),questions:data}];
    if(data&&Array.isArray(data.banks))return data.banks.map((b,i)=>({name:String(b&&b.name||`题库${i+1}`).trim(),questions:b&&b.questions}));
    if(data&&Array.isArray(data.questions))return [{name:String(data.name||fileName.replace(/\.json$/i,'')),questions:data.questions}];
    throw new Error('无法识别 JSON 结构');
  }
  async function loadFiles(files){let added=0,errors=[];for(const file of files){try{const data=JSON.parse(await file.text());for(const raw of unpack(data,file.name)){if(!raw.name||!Array.isArray(raw.questions))throw new Error('题库名称或 questions 无效');let name=raw.name,n=2;while(state.banks.some(b=>b.name===name))name=`${raw.name} (${n++})`;const questions=raw.questions.map((q,i)=>normalizeQuestion(q,name,i));state.banks.push({name,questions,file:file.name});state.questions.push(...questions);added+=questions.length}}catch(e){errors.push(`${file.name}: ${e.message}`)}}renderAll();showNotice(errors.length?`已导入 ${added} 题；${errors.join('；')}`:`成功导入 ${added} 道题目。`,errors.length?'err':'ok')}
  function showNotice(text,type){const el=$('notice');el.textContent=text;el.className=`notice show ${type}`}
  function renderAll(){const names=[...new Set(state.banks.map(b=>b.name))],types=[...new Set(state.questions.map(q=>q.type))];fillSelect($('bankFilter'),tr('allBanks'),names);fillSelect($('typeFilter'),tr('allTypes'),types);$('bankList').textContent=state.banks.length?`${tr('loaded')}: ${state.banks.map(b=>`${b.name} (${b.questions.length} ${tr('questions')})`).join(' · ')}`:'';$('bankCount').textContent=state.banks.length;$('totalCount').textContent=state.questions.length;$('confirmedCount').textContent=state.questions.filter(q=>q.correct.length).length;$('pendingCount').textContent=state.questions.filter(q=>!q.correct.length).length;$('clearBtn').disabled=!state.questions.length;$('exportBtn').disabled=!state.questions.length;applyFilters()}
  function fillSelect(el,label,values){const old=el.value;el.replaceChildren(new Option(label,''),...values.map(v=>new Option(v,v)));el.value=values.includes(old)?old:''}
  function applyFilters(){const term=$('search').value.trim().toLowerCase(),bank=$('bankFilter').value,type=$('typeFilter').value,status=$('answerFilter').value;state.filtered=state.questions.filter(q=>(!bank||q.bank===bank)&&(!type||q.type===type)&&(!status||(status==='confirmed'?q.correct.length:!q.correct.length))&&(!term||[q.question,...q.options,...q.correct,...q.suggested].join(' ').toLowerCase().includes(term)));state.page=1;renderQuestions()}
  function text(parent,tag,value,cls){const el=document.createElement(tag);if(cls)el.className=cls;el.textContent=value;parent.appendChild(el);return el}
  function renderQuestions(){const list=$('questionList');list.replaceChildren();$('filteredCount').textContent=state.filtered.length;if(!state.filtered.length){text(list,'div',state.questions.length?tr('noMatch'):tr('empty'),'card empty');renderPager();return}const start=(state.page-1)*state.pageSize;state.filtered.slice(start,start+state.pageSize).forEach((q,i)=>{const card=document.createElement('article');card.className='question';const head=text(card,'div','','qhead');text(head,'div',String(start+i+1),'num');text(head,'div',q.question,'qtext');const badges=text(head,'div','','badges');text(badges,'span',q.type,'badge');text(badges,'span',q.correct.length?tr('statusConfirmed'):tr('statusPending'),`badge ${q.correct.length?'confirmed':'pending'}`);const body=text(card,'div','','body');q.options.forEach((o,j)=>text(body,'div',`${String.fromCharCode(65+j)}. ${o}`,'option'));const answer=text(body,'div','','answer');answerRow(answer,tr('correct'),q.correct,'correct');answerRow(answer,tr('suggested'),q.suggested,'guess');answerRow(answer,tr('defWrong'),q.definiteWrong,'wrong');answerRow(answer,tr('wrong'),q.wrong,'wrong');if(q.wrongCombinations.length)answerRow(answer,tr('wrongCombo'),q.wrongCombinations.map(x=>x.join(' + ')),'wrong');const foot=text(body,'div','','qfoot');text(foot,'span',`${q.bank} · ${tr('original')} ${q.number} · ${tr('occurred')} ${q.occurrences} ${tr('times')}`);const btn=text(foot,'button',tr('show'),'link-btn');btn.onclick=()=>{card.classList.toggle('reveal');btn.textContent=card.classList.contains('reveal')?tr('hide'):tr('show')};list.appendChild(card)});renderPager()}
  function answerRow(parent,label,values,cls){if(!values.length)return;const row=text(parent,'div','',`answer-row ${cls}`);text(row,'b',label);row.append(document.createTextNode(values.join(' 、 ')))}
  function renderPager(){const pages=Math.ceil(state.filtered.length/state.pageSize),p=$('pager');p.replaceChildren();if(pages<=1)return;const prev=text(p,'button',tr('prev'));prev.disabled=state.page===1;prev.onclick=()=>{state.page--;renderQuestions();scrollTo({top:document.querySelector('.toolbar').offsetTop,behavior:'smooth'})};text(p,'span',`${state.page} / ${pages}`);const next=text(p,'button',tr('next'));next.disabled=state.page===pages;next.onclick=()=>{state.page++;renderQuestions();scrollTo({top:document.querySelector('.toolbar').offsetTop,behavior:'smooth'})}}
  function excelRows(qs){const en=state.lang==='en';return qs.map((q,i)=>{const values=[i+1,q.bank,en?({'判断题':'True/False','单选题':'Single Choice','多选题':'Multiple Choice'}[q.type]||q.type):q.type,q.number,q.question,q.options.map((x,j)=>`${String.fromCharCode(65+j)}. ${x}`).join('\n'),q.correct.join('\n'),q.suggested.join('\n'),q.wrong.join('\n'),q.definiteWrong.join('\n'),q.wrongCombinations.map(x=>x.join(' + ')).join('\n'),q.occurrences,q.suggestionCount,q.suggestionUseCount,q.suggestionUpdatedAt,q.id,q.variantKey];const headers=en?['No.','Question Bank','Question Type','Original No.','Question','Options','Correct Answers','Suggested Answers','Wrong Answers','Definitely Wrong Answers','Wrong Combinations','Occurrence Count','Suggestion Count','Suggestion Use Count','Suggestion Updated At','ID','Variant Key']:['序号','题库','题型','原题号','题目','选项','正确答案','疑似答案','错误答案','明确错误答案','错误组合','出现次数','猜测次数','猜测采用次数','猜测更新时间','ID','变体标识'];return Object.fromEntries(headers.map((h,j)=>[h,values[j]]))})}
  function addSheet(wb,name,rows){const ws=XLSX.utils.json_to_sheet(excelRows(rows));ws['!cols']=[{wch:7},{wch:22},{wch:12},{wch:10},{wch:55},{wch:55},{wch:28},{wch:28},{wch:28},{wch:28},{wch:32},{wch:10},{wch:10},{wch:14},{wch:22},{wch:20},{wch:25}];ws['!autofilter']={ref:ws['!ref']};XLSX.utils.book_append_sheet(wb,ws,name)}
  function sheetName(raw,used){let base=String(raw).replace(/[\\/?*\[\]:]/g,' ').trim().slice(0,31)||'题库',name=base,n=2;while(used.has(name))name=`${base.slice(0,27)}(${n++})`;used.add(name);return name}
  function exportExcel(){const en=state.lang==='en';if(typeof XLSX==='undefined'){showNotice(en?'Excel component failed to load. Refresh the page and try again.':'Excel 组件未加载，请刷新页面后重试。','err');return}const wb=XLSX.utils.book_new(),used=new Set();const summary=state.banks.map(b=>en?{'Question Bank':b.name,'Question Count':b.questions.length,'Confirmed Answers':b.questions.filter(q=>q.correct.length).length,'Unconfirmed':b.questions.filter(q=>!q.correct.length).length,'True/False':b.questions.filter(q=>q.type==='判断题').length,'Single Choice':b.questions.filter(q=>q.type==='单选题').length,'Multiple Choice':b.questions.filter(q=>q.type==='多选题').length}:{'题库':b.name,'题目数':b.questions.length,'已确认答案':b.questions.filter(q=>q.correct.length).length,'待确认':b.questions.filter(q=>!q.correct.length).length,'判断题':b.questions.filter(q=>q.type==='判断题').length,'单选题':b.questions.filter(q=>q.type==='单选题').length,'多选题':b.questions.filter(q=>q.type==='多选题').length});const overview=en?'Overview':'题库概览';XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(summary),overview);used.add(overview);addSheet(wb,sheetName(en?'All Questions':'全部题目',used),state.questions);if(state.filtered.length!==state.questions.length)addSheet(wb,sheetName(en?'Filtered Results':'当前筛选',used),state.filtered);state.banks.forEach(b=>addSheet(wb,sheetName(b.name,used),b.questions));XLSX.writeFile(wb,`${en?'Question_Bank_Study':'题库学习'}_${new Date().toISOString().slice(0,10)}.xlsx`,{compression:true})}
  $('fileInput').onchange=e=>loadFiles([...e.target.files]);const dz=$('dropZone');['dragenter','dragover'].forEach(x=>dz.addEventListener(x,e=>{e.preventDefault();dz.classList.add('drag')}));['dragleave','drop'].forEach(x=>dz.addEventListener(x,e=>{e.preventDefault();dz.classList.remove('drag')}));dz.addEventListener('drop',e=>loadFiles([...e.dataTransfer.files].filter(f=>f.name.toLowerCase().endsWith('.json'))));dz.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')$('fileInput').click()};
  $('sampleBtn').onclick=()=>{const sample=[{name:'示例题库',questions:[{questionType:'Single Choice',questionNumber:1,question:'HTML 中用于创建超链接的标签是？',options:['<a>','<p>','<table>','<img>'],correctAnswers:['<a>'],occurrenceCount:2},{'题型':'多选题','题号':2,'题目':'以下哪些是 JSON 支持的值类型？','选项':['字符串','数字','函数','布尔值'],'猜测答案':['字符串','数字','布尔值'],'出现次数':1}]}];for(const b of sample){const questions=b.questions.map((q,i)=>normalizeQuestion(q,b.name,i));state.banks.push({name:b.name,questions,file:'sample'});state.questions.push(...questions)}renderAll();showNotice('已加载示例题库。','ok')};
  $('clearBtn').onclick=()=>{state.banks=[];state.questions=[];$('search').value='';$('answerFilter').value='';$('notice').className='notice';renderAll()};$('exportBtn').onclick=exportExcel;$('langBtn').onclick=()=>{state.lang=state.lang==='zh'?'en':'zh';applyLanguage()};['search','bankFilter','typeFilter','answerFilter'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',applyFilters));applyLanguage();
})();
</script>
</body></html>
