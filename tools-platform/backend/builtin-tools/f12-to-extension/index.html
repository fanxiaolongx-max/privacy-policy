<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F12 脚本扩展打包器 (F12 to Extension)</title>
  
  <!-- Tailwind CSS for UI styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- JSZip for creating zip files in the browser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  
  <!-- FileSaver for triggering the download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      min-height: 100vh;
      margin: 0;
    }
    .glass-panel {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .input-field {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f8fafc;
      transition: all 0.3s ease;
    }
    .input-field:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }
    .input-field::placeholder {
      color: #475569;
    }
    /* Custom Scrollbar for Textarea */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
  </style>
</head>
<body class="p-4 md:p-8 flex items-center justify-center min-h-screen">

  <div class="glass-panel w-full max-w-6xl rounded-2xl p-6 md:p-10 flex flex-col lg:flex-row gap-8 lg:gap-10">
    
    <!-- Left Column: Form Settings -->
    <div class="w-full lg:w-5/12 flex flex-col gap-6">
      <div>
        <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-cyan-400 mb-2 tracking-tight">F12 脚本扩展打包器</h1>
        <p class="text-slate-400 text-sm leading-relaxed">一键将您的 F12 控制台脚本转化为标准的 Manifest V3 浏览器扩展，支持 Microsoft Edge 与 Google Chrome。</p>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wide">扩展名称</label>
          <input type="text" id="extName" value="SV/CFC 满意度监控" class="input-field w-full rounded-lg px-3 py-2.5 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wide">版本</label>
          <input type="text" id="extVersion" value="1.0.0" class="input-field w-full rounded-lg px-3 py-2.5 text-sm">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wide">描述</label>
        <input type="text" id="extDesc" value="监控 SV/CFC 餐厅满意度，分析问卷明细并复核评分。" class="input-field w-full rounded-lg px-3 py-2.5 text-sm">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wide">匹配网址 (Host Permissions)</label>
        <textarea id="extMatch" rows="2" class="input-field w-full rounded-lg px-3 py-2.5 text-sm resize-y" placeholder="例如: https://w3.huawei.com/*">https://w3.huawei.com/*</textarea>
        <p class="text-[11px] text-slate-500 mt-1.5">支持多个地址，每行一个或用英文逗号分隔。</p>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wide">注入环境 (World)</label>
          <select id="extWorld" class="input-field w-full rounded-lg px-3 py-2.5 text-sm">
            <option value="MAIN">MAIN (主页面 - 可访问 window)</option>
            <option value="ISOLATED">ISOLATED (隔离环境 - 默认)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wide">生成 Popup 弹窗</label>
          <select id="extPopup" class="input-field w-full rounded-lg px-3 py-2.5 text-sm">
            <option value="yes">是 (包含工具栏图标弹窗)</option>
            <option value="no">否 (仅静默注入)</option>
          </select>
        </div>
      </div>

      <details class="rounded-xl border border-white/10 bg-slate-950/30 p-4">
        <summary class="cursor-pointer text-sm font-semibold text-slate-200">高级兼容选项（默认不改变现有打包结果）</summary>
        <div class="mt-4 grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1.5">执行时机</label>
            <select id="extRunAt" class="input-field w-full rounded-lg px-3 py-2.5 text-sm">
              <option value="document_idle">document_idle（默认）</option>
              <option value="document_start">document_start</option>
              <option value="document_end">document_end</option>
            </select>
          </div>
          <label class="flex items-center gap-2 self-end pb-2 text-sm text-slate-300">
            <input id="extAllFrames" type="checkbox" class="accent-indigo-500">
            同时注入 iframe
          </label>
        </div>
        <div class="mt-4">
          <span class="block text-xs font-semibold text-slate-300 mb-2">附加权限（按需选择）</span>
          <div class="grid grid-cols-2 gap-2 text-xs text-slate-400">
            <label><input type="checkbox" data-extra-permission="downloads" class="mr-1.5 accent-indigo-500">下载文件</label>
            <label><input type="checkbox" data-extra-permission="cookies" class="mr-1.5 accent-indigo-500">Cookies</label>
            <label><input type="checkbox" data-extra-permission="clipboardWrite" class="mr-1.5 accent-indigo-500">写入剪贴板</label>
            <label><input type="checkbox" data-extra-permission="notifications" class="mr-1.5 accent-indigo-500">系统通知</label>
            <label><input type="checkbox" data-extra-permission="tabs" class="mr-1.5 accent-indigo-500">标签页信息</label>
            <label><input type="checkbox" data-extra-permission="alarms" class="mr-1.5 accent-indigo-500">定时任务</label>
          </div>
        </div>
      </details>
    </div>

    <!-- Right Column: Code Editor & Action -->
    <div class="w-full lg:w-7/12 flex flex-col gap-5">
      <div class="flex-grow flex flex-col h-full relative">
        <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wide flex justify-between">
          <span>F12 控制台脚本 (content.js)</span>
        </label>
        
        <!-- Editor Wrapper -->
        <div class="relative flex-grow h-[350px] lg:h-[450px]">
          <!-- Decorative MacOS style dots -->
          <div class="absolute top-0 left-0 w-full h-8 bg-gray-800/80 rounded-t-lg border-b border-white/10 flex items-center px-3 gap-1.5 z-10">
            <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
            <div class="w-3 h-3 rounded-full bg-yellow-500/80"></div>
            <div class="w-3 h-3 rounded-full bg-green-500/80"></div>
            <span class="text-xs text-gray-400 font-mono ml-2">content.js</span>
          </div>
          <textarea id="extCode" class="input-field w-full h-full rounded-lg pt-12 p-4 font-mono text-[13px] leading-relaxed resize-none focus:ring-0" spellcheck="false" placeholder="// 在此粘贴你的 F12 控制台脚本代码...&#10;&#10;(() => {&#10;  'use strict';&#10;  console.log('满意度监控扩展已加载');&#10;  &#10;  // your code here&#10;})();"></textarea>
        </div>
        <div id="compatReport" class="hidden mt-3 rounded-lg border px-3 py-2 text-xs leading-relaxed" role="status"></div>
      </div>

      <button id="packBtn" class="w-full bg-gradient-to-r from-indigo-500 to-cyan-500 hover:from-indigo-400 hover:to-cyan-400 text-white font-bold py-3.5 px-4 rounded-xl transition-all shadow-[0_0_20px_rgba(99,102,241,0.3)] hover:shadow-[0_0_30px_rgba(34,211,238,0.5)] transform hover:-translate-y-0.5 flex items-center justify-center gap-2 group">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 group-hover:animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
        </svg>
        <span>打包为 Edge/Chrome 扩展 (.zip)</span>
      </button>
    </div>

  </div>

  <script src="./packer-core.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('./default-f12.js?t=' + Date.now());
        if (res.ok) {
          const text = await res.text();
          if (text) {
            document.getElementById('extCode').value = text;
          }
        }
      } catch (e) {
        console.log('No default F12 script found, using placeholder.');
      }
    });

    function collectOptions() {
      return {
        name: document.getElementById('extName').value.trim() || 'My Extension',
        version: document.getElementById('extVersion').value.trim() || '1.0.0',
        description: document.getElementById('extDesc').value.trim() || 'Generated by F12 Packer',
        matches: document.getElementById('extMatch').value,
        world: document.getElementById('extWorld').value,
        includePopup: document.getElementById('extPopup').value === 'yes',
        runAt: document.getElementById('extRunAt').value,
        allFrames: document.getElementById('extAllFrames').checked,
        optionalPermissions: [...document.querySelectorAll('[data-extra-permission]:checked')]
          .map(input => input.dataset.extraPermission),
        code: document.getElementById('extCode').value
      };
    }

    function renderReport(validation) {
      const report = document.getElementById('compatReport');
      const entries = [
        ...validation.errors.map(message => `❌ ${message}`),
        ...validation.warnings.map(message => `⚠️ ${message}`),
        ...validation.suggestions.map(message => `💡 ${message}`)
      ];
      if (!entries.length) entries.push('✅ 兼容性检查通过，可生成标准 Manifest V3 扩展。');
      report.textContent = entries.join('\n');
      report.className = `mt-3 rounded-lg border px-3 py-2 text-xs leading-relaxed whitespace-pre-wrap ${
        validation.errors.length
          ? 'border-red-500/40 bg-red-950/30 text-red-200'
          : validation.warnings.length || validation.suggestions.length
            ? 'border-amber-500/40 bg-amber-950/30 text-amber-100'
            : 'border-emerald-500/40 bg-emerald-950/30 text-emerald-100'
      }`;
    }

    document.getElementById('packBtn').addEventListener('click', async () => {
      const options = collectOptions();
      const validation = F12ExtensionPacker.validateOptions(options);
      renderReport(validation);
      if (validation.errors.length) return;

      try {
        const generated = F12ExtensionPacker.buildPackage(options);
        const zip = new JSZip();
        Object.entries(generated.files).forEach(([fileName, content]) => zip.file(fileName, content));
        const content = await zip.generateAsync({ type: "blob" });
        const fileName = "extension-" + options.name.replace(/[^a-zA-Z0-9]/g, '-').toLowerCase() + ".zip";
        saveAs(content, fileName);
        
        // Show success state on button
        const btn = document.getElementById('packBtn');
        const originalHtml = btn.innerHTML;
        btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg> <span>打包成功！</span>`;
        btn.classList.replace('from-indigo-500', 'from-emerald-500');
        btn.classList.replace('to-cyan-500', 'to-teal-500');
        
        setTimeout(() => {
          btn.innerHTML = originalHtml;
          btn.classList.replace('from-emerald-500', 'from-indigo-500');
          btn.classList.replace('to-teal-500', 'to-cyan-500');
        }, 3000);
      } catch (err) {
        alert("打包失败: " + err.message);
      }
    });
  </script>
</body>
</html>
