<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; }
        html, body { width: 620px; height: 340px; margin: 0; overflow: hidden; }
        body {
            position: relative;
            color: #f8fafc;
            font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
            background:
                radial-gradient(circle at 7% 98%, rgba(45, 212, 191, .18), transparent 31%),
                radial-gradient(circle at 96% 2%, rgba(59, 130, 246, .22), transparent 34%),
                linear-gradient(145deg, #071220, #0a1327 58%, #0d1730);
        }
        body::before {
            content: "";
            position: absolute;
            inset: 8px 12px;
            border-radius: 42px;
            background: radial-gradient(circle at 18% 0, rgba(45, 212, 191, .16), transparent 34%);
            box-shadow: 0 0 26px rgba(45, 212, 191, .15), 0 0 54px rgba(59, 130, 246, .12);
        }
        .panel {
            position: absolute;
            inset: 14px;
            overflow: hidden;
            border: 1px solid rgba(186, 230, 253, .42);
            border-radius: 38px;
            background:
                radial-gradient(circle at 100% 0, rgba(59, 130, 246, .17), transparent 33%),
                radial-gradient(circle at 0 100%, rgba(45, 212, 191, .11), transparent 30%),
                linear-gradient(145deg, rgba(9, 25, 43, .97), rgba(14, 23, 48, .98));
            box-shadow: inset 0 1px 0 rgba(255,255,255,.13), inset 0 -1px 0 rgba(96,165,250,.10);
        }
        .panel::after {
            content: "";
            position: absolute;
            top: -92px;
            right: -58px;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            background: rgba(96, 165, 250, .09);
        }
        main { position: relative; z-index: 1; height: 100%; padding: 28px 30px 24px; display: grid; grid-template-rows: auto 1fr auto; }
        header { display: flex; align-items: center; gap: 15px; }
        img { width: 55px; height: 55px; filter: drop-shadow(0 10px 18px rgba(0,0,0,.32)); }
        .name { font-size: 29px; font-weight: 350; letter-spacing: -.02em; }
        .tag { margin-top: 4px; color: #6ee7d2; font-size: 11px; font-weight: 800; letter-spacing: .03em; }
        .status { align-self: center; }
        h1 { margin: 0; font-size: 21px; font-weight: 750; }
        p { margin: 9px 0 0; color: rgba(203,213,225,.78); font-size: 13px; }
        .track { height: 10px; overflow: hidden; border: 1px solid rgba(148,163,184,.23); border-radius: 999px; background: rgba(2,8,23,.48); }
        .bar { width: 56%; height: 100%; border-radius: inherit; background: linear-gradient(90deg,#35d0ba,#4fd1c5 52%,#60a5fa); box-shadow: 0 0 18px rgba(45,212,191,.48); }
        .foot { margin-top: 10px; color: rgba(148,163,184,.68); font-size: 10px; }
    </style>
</head>
<body>
    <section class="panel">
        <main>
            <header>
                <img src="../assets/icon-windows-portable.png" alt="">
                <div><div class="name">Tools Platform</div><div class="tag">PORTABLE WORKSPACE</div></div>
            </header>
            <div class="status"><h1>正在准备绿色便携版</h1><p>解压本地组件与运行环境，请稍候…</p></div>
            <footer><div class="track"><div class="bar"></div></div><div class="foot">首次运行或版本更新时，准备时间可能稍长。</div></footer>
        </main>
    </section>
</body>
</html>
