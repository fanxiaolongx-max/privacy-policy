<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EXE License 签发与管理</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#07101f;color:#dbeafe;font-family:Inter,Segoe UI,"Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 20px 60px}h1{margin:0;font-size:28px}.hint{color:#8fa6c3;font-size:13px;line-height:1.6}.panel{margin-top:20px;padding:18px;border:1px solid #25344d;border-radius:16px;background:#0e192b}.grid{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px}.input,select{width:100%;border:1px solid #3a4a64;border-radius:9px;background:#091321;color:#dbeafe;padding:10px}.btn{border:0;border-radius:9px;padding:10px 14px;color:white;background:#2563eb;font-weight:700;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.btn.small{padding:7px 10px;font-size:12px}.btn.cyan{background:#0891b2}.btn.red{background:#b91c1c}.btn.green{background:#047857}.btn.gray{background:#475569}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.list{display:grid;gap:12px;margin-top:14px}.card{padding:15px;border:1px solid #263751;border-radius:13px;background:#0a1424}.row{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.name{font-size:16px;font-weight:750}.badge{display:inline-block;margin-left:8px;padding:3px 8px;border-radius:999px;font-size:11px}.active{background:#064e3b;color:#a7f3d0}.revoked,.archived{background:#641b1b;color:#fecaca}.expired{background:#713f12;color:#fde68a}.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;margin:12px 0;color:#9db0c9;font-size:12px}.mono{font-family:Consolas,monospace;word-break:break-all}.actions{display:flex;flex-wrap:wrap;gap:7px}.issued{display:none;margin-top:14px;padding:14px;border:1px solid #0e7490;border-radius:12px;background:#083344}.issued.show{display:block}textarea{min-height:82px}.warn{color:#fbbf24}
    .modal{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(2,6,23,.76);backdrop-filter:blur(8px)}.modal.show{display:flex}.modal-card{width:min(620px,96vw);overflow:hidden;border:1px solid #344967;border-radius:18px;background:#0d192a;box-shadow:0 28px 90px rgba(0,0,0,.55)}.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:20px 22px 16px;border-bottom:1px solid #263751;background:#111e31}.modal-head small{color:#67e8f9;font-size:10px;font-weight:800;letter-spacing:.14em}.modal-head h2{margin:4px 0 0;font-size:21px}.icon-btn{width:34px;height:34px;border:1px solid #3a4a64;border-radius:9px;background:#17243a;color:#a9bad0;font-size:22px;cursor:pointer}.modal-body{padding:20px 22px}.license-summary{padding:12px 14px;border:1px solid #263751;border-radius:11px;background:#091321;color:#9db0c9;font-size:12px;line-height:1.7;white-space:pre-line}.field-label{display:block;margin:17px 0 8px;color:#b9c9dc;font-size:12px;font-weight:700}.quick-days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick-day{border:1px solid #3a4a64;border-radius:9px;padding:9px 6px;background:#101c2f;color:#c6d5e7;font-weight:700;cursor:pointer}.quick-day:hover,.quick-day.selected{border-color:#38bdf8;background:#0c4a6e;color:#e0f2fe}.date-control{color-scheme:dark}.renew-preview{margin-top:14px;padding:12px 14px;border-left:3px solid #22c55e;border-radius:8px;background:#09281f;color:#bbf7d0;font-size:13px;line-height:1.7}.renew-warning{margin:12px 0 0;color:#fbbf24;font-size:11px;line-height:1.6}.modal-actions{display:flex;justify-content:flex-end;gap:9px;padding:15px 22px;border-top:1px solid #263751;background:#0a1424}.toast{position:fixed;z-index:1100;right:22px;bottom:22px;max-width:min(430px,calc(100vw - 44px));padding:12px 16px;border:1px solid #166534;border-radius:11px;background:#052e25;color:#bbf7d0;box-shadow:0 15px 45px rgba(0,0,0,.4);font-size:13px;opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateY(0)}.toast.error{border-color:#991b1b;background:#3f1017;color:#fecaca}
    @media(max-width:760px){.grid{grid-template-columns:1fr}.meta{grid-template-columns:1fr}.row{display:block}.quick-days{grid-template-columns:repeat(2,1fr)}.modal{padding:0;align-items:flex-end}.modal-card{width:100%;max-height:96vh;border-radius:18px 18px 0 0}.modal-body{overflow:auto}.modal-actions{position:sticky;bottom:0}}
  </style>
</head>
<body><main class="wrap">
  <h1>EXE License 签发与管理</h1>
  <p class="hint">此页面只在服务器管理端提供，不会打包进安装版或绿色版 EXE。产品标识固定为 <b>tools-platform-desktop</b>，两种 EXE 共用公司通用 License。有效期已写入数字签名，无网络也可在本地验证。</p>
  <section class="panel">
    <div class="grid">
      <input id="label" class="input" maxlength="120" placeholder="授权对象/电脑备注（必填，例如：张三-办公电脑）">
      <select id="days"><option value="1">1 天</option><option value="7">7 天</option><option value="30" selected>30 天</option><option value="90">90 天</option><option value="180">180 天</option><option value="365">365 天</option></select>
      <input id="expiresAt" class="input" type="datetime-local" title="可选：指定精确到期时间">
      <button id="issue" class="btn">签发 License</button>
    </div>
    <div id="issued" class="issued"><div id="issuedMeta" class="hint"></div><textarea id="issuedToken" class="input mono" readonly></textarea><button id="copyIssued" class="btn small cyan">复制密钥</button></div>
  </section>
  <section class="panel">
    <div class="toolbar"><input id="search" class="input" style="max-width:520px" placeholder="搜索备注、License ID、状态"><label class="hint"><input id="showArchived" type="checkbox" checked> 显示已归档</label><button id="refresh" class="btn small gray">刷新</button></div>
    <div id="summary" class="hint" style="margin-top:10px"></div><div id="list" class="list"></div>
  </section>
</main>
<div id="renewModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="renewTitle">
  <section class="modal-card">
    <header class="modal-head"><div><small>LICENSE RENEWAL</small><h2 id="renewTitle">续期并换发新密钥</h2></div><button id="closeRenew" class="icon-btn" type="button" aria-label="关闭">×</button></header>
    <div class="modal-body">
      <div id="renewIdentity" class="license-summary"></div>
      <label class="field-label">快捷延长</label>
      <div class="quick-days"><button class="quick-day" type="button" data-renew-days="1">+1 天</button><button class="quick-day" type="button" data-renew-days="7">+7 天</button><button class="quick-day" type="button" data-renew-days="30">+30 天</button><button class="quick-day" type="button" data-renew-days="365">+365 天</button></div>
      <label class="field-label" for="renewDate">或直接选择新到期日期</label>
      <input id="renewDate" class="input date-control" type="date">
      <div id="renewPreview" class="renew-preview"></div>
      <p class="renew-warning">确认后会生成包含新签名到期时间的密钥，需要提供给用户重新输入。旧密钥可继续使用到原到期时间。</p>
    </div>
    <footer class="modal-actions"><button id="cancelRenew" class="btn gray" type="button">取消</button><button id="confirmRenew" class="btn green" type="button">确认续期并换发</button></footer>
  </section>
</div>
<div id="toast" class="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id);let records=[];const token=()=>localStorage.getItem('tools_token')||'';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v?new Date(Number(v)).toLocaleString():'--';
async function api(path,options={}){const res=await fetch('/api/desktop-licenses'+path,{...options,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token(),...(options.headers||{})}});const body=await res.json().catch(()=>({}));if(!res.ok)throw new Error(body.error||`HTTP ${res.status}`);return body}
function effectiveStatus(r){if(r.status==='active'&&Date.now()>=r.expiresAt)return'expired';return r.status}
function identity(r){return `授权对象：${r.label||'未填写'}\n产品：Tools Platform Desktop（安装版+绿色版）\nLicense ID：${r.licenseId}\n到期：${fmt(r.expiresAt)}`}
const localDateValue=value=>{const d=new Date(value);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
let pendingRenewal=null;let toastTimer=null;
function showToast(message,type='success'){const el=$('toast');el.textContent=message;el.className=`toast ${type==='error'?'error ':''}show`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.className='toast',3600)}
function renewalPreview(){if(!pendingRenewal)return;let next;if(pendingRenewal.mode==='days'){next=Math.max(Date.now(),Number(pendingRenewal.record.expiresAt))+pendingRenewal.days*86400000}else{const value=$('renewDate').value;next=value?new Date(value+'T23:59:59.999').getTime():NaN}const valid=Number.isFinite(next)&&next>Date.now();$('renewPreview').innerHTML=valid?`新到期时间：<b>${fmt(next)}</b><br>续期方式：${pendingRenewal.mode==='days'?`原到期时间基础上 +${pendingRenewal.days} 天`:'指定日期（当天 23:59:59）'}`:'<span class="warn">请选择一个晚于当前时间的日期</span>';$('confirmRenew').disabled=!valid;pendingRenewal.nextExpiresAt=valid?next:null}
function selectRenewDays(days){if(!pendingRenewal)return;pendingRenewal.mode='days';pendingRenewal.days=Number(days);document.querySelectorAll('[data-renew-days]').forEach(btn=>btn.classList.toggle('selected',Number(btn.dataset.renewDays)===pendingRenewal.days));const preview=Math.max(Date.now(),Number(pendingRenewal.record.expiresAt))+pendingRenewal.days*86400000;$('renewDate').value=localDateValue(preview);renewalPreview()}
function openRenewModal(record,days=null){pendingRenewal={record,mode:days?'days':'date',days:Number(days)||null,nextExpiresAt:null};$('renewIdentity').textContent=identity(record);const suggested=Math.max(Date.now()+86400000,Number(record.expiresAt)+86400000);$('renewDate').min=localDateValue(Date.now());$('renewDate').value=localDateValue(suggested);$('renewModal').classList.add('show');document.querySelectorAll('[data-renew-days]').forEach(btn=>btn.classList.remove('selected'));if(days)selectRenewDays(days);else renewalPreview();setTimeout(()=>$('renewDate').focus(),0)}
function closeRenewModal(){if($('confirmRenew').disabled&&$('confirmRenew').dataset.loading==='1')return;$('renewModal').classList.remove('show');pendingRenewal=null}
function render(){const q=$('search').value.trim().toLowerCase();const rows=records.filter(r=>($('showArchived').checked||r.status!=='archived')&&[r.label,r.licenseId,r.status].join(' ').toLowerCase().includes(q));$('summary').textContent=`共 ${records.length} 条，当前显示 ${rows.length} 条`;$('list').innerHTML=rows.map(r=>{const s=effectiveStatus(r);return `<article class="card"><div class="row"><div><span class="name">${esc(r.label||'未填写授权对象')}</span><span class="badge ${s}">${esc(s)}</span></div><span class="hint">安装版 / 绿色版</span></div><div class="meta"><div>License ID：<span class="mono">${esc(r.licenseId)}</span></div><div>到期：<b class="${s==='expired'?'warn':''}">${fmt(r.expiresAt)}</b></div><div>签发：${fmt(Date.parse(r.issuedAt))}</div><div>最后更新：${fmt(Date.parse(r.updatedAt))}</div>${r.revokeReason?`<div>失效原因：${esc(r.revokeReason)}</div>`:''}</div><div class="actions"><button class="btn small cyan" data-a="copy" data-id="${r.licenseId}">复制密钥</button><button class="btn small" data-a="renew1" data-id="${r.licenseId}">+1天</button><button class="btn small" data-a="renew7" data-id="${r.licenseId}">+7天</button><button class="btn small" data-a="renew30" data-id="${r.licenseId}">+30天</button><button class="btn small" data-a="renew365" data-id="${r.licenseId}">+365天</button><button class="btn small gray" data-a="renewCustom" data-id="${r.licenseId}">指定日期</button>${r.status==='revoked'?`<button class="btn small green" data-a="restore" data-id="${r.licenseId}">恢复</button>`:`<button class="btn small red" data-a="revoke" data-id="${r.licenseId}">立即失效</button>`}${r.status!=='archived'?`<button class="btn small gray" data-a="archive" data-id="${r.licenseId}">归档</button>`:`<button class="btn small green" data-a="restore" data-id="${r.licenseId}">恢复</button>`}</div></article>`}).join('')||'<div class="hint">没有匹配记录</div>'}
async function load(){try{records=(await api('/?includeArchived=1')).licenses||[];render()}catch(e){$('summary').textContent='读取失败：'+e.message}}
$('issue').onclick=async()=>{const label=$('label').value.trim();if(!label)return alert('请填写授权对象/电脑备注，避免后续误操作。');const exact=$('expiresAt').value;try{const body=await api('/issue',{method:'POST',body:JSON.stringify({label,days:Number($('days').value),expiresAt:exact?new Date(exact).getTime():undefined})});$('issuedToken').value=body.token;$('issuedMeta').textContent=`${identity(body.record).replace(/\n/g,' ｜ ')}`;$('issued').classList.add('show');await load()}catch(e){alert('签发失败：'+e.message)}};
$('copyIssued').onclick=()=>navigator.clipboard.writeText($('issuedToken').value);$('search').oninput=render;$('showArchived').onchange=render;$('refresh').onclick=load;
$('renewDate').onchange=()=>{if(!pendingRenewal)return;pendingRenewal.mode='date';document.querySelectorAll('[data-renew-days]').forEach(btn=>btn.classList.remove('selected'));renewalPreview()};
$('renewDate').onclick=e=>{try{e.currentTarget.showPicker?.()}catch(_){}};
document.querySelectorAll('[data-renew-days]').forEach(btn=>btn.onclick=()=>selectRenewDays(Number(btn.dataset.renewDays)));
$('closeRenew').onclick=closeRenewModal;$('cancelRenew').onclick=closeRenewModal;
$('renewModal').onclick=e=>{if(e.target===$('renewModal'))closeRenewModal()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('renewModal').classList.contains('show'))closeRenewModal()});
$('confirmRenew').onclick=async()=>{if(!pendingRenewal||!pendingRenewal.nextExpiresAt)return;const {record,mode,days,nextExpiresAt}=pendingRenewal;const button=$('confirmRenew');button.disabled=true;button.dataset.loading='1';button.textContent='正在换发…';try{const payload=mode==='days'?{days}:{expiresAt:nextExpiresAt};const renewed=await api(`/${record.licenseId}/renew`,{method:'POST',body:JSON.stringify(payload)});$('issuedToken').value=renewed.token;$('issuedMeta').textContent=`续期换发成功 ｜ ${identity(renewed.record).replace(/\n/g,' ｜ ')}`;$('issued').classList.add('show');button.dataset.loading='0';closeRenewModal();await load();window.scrollTo({top:0,behavior:'smooth'});showToast('续期换发成功，请复制页面上方的新密钥。')}catch(err){showToast('续期失败：'+err.message,'error')}finally{button.disabled=false;button.dataset.loading='0';button.textContent='确认续期并换发'}};
$('list').onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const r=records.find(x=>x.licenseId===b.dataset.id);if(!r)return;const a=b.dataset.a;if(/^renew(?:1|7|30|365|Custom)$/.test(a)){openRenewModal(r,a==='renewCustom'?null:Number(a.replace('renew','')));return}try{if(a==='copy'){await navigator.clipboard.writeText(r.token);showToast('密钥已复制');return}if(a==='revoke'){const reason=prompt(`确认让以下 License 立即失效？\n\n${identity(r)}\n\n请输入原因：`,'管理员手动失效');if(reason===null)return;await api(`/${r.licenseId}/revoke`,{method:'POST',body:JSON.stringify({reason})})}else if(a==='restore'){if(!confirm(`确认恢复？\n\n${identity(r)}\n\n若已过期，还需要续期。`))return;await api(`/${r.licenseId}/restore`,{method:'POST'})}else if(a==='archive'){const typed=prompt(`归档后 License 会失效。\n\n${identity(r)}\n\n为避免误操作，请输入完整 License ID：`,'');if(typed!==r.licenseId)return alert('License ID 不匹配，已取消。');await api(`/${r.licenseId}/archive`,{method:'POST'})}await load()}catch(err){alert('操作失败：'+err.message)}};load();
</script></body></html>
