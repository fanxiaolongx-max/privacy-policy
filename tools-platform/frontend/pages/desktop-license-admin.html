<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EXE License 签发与管理</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#07101f;color:#dbeafe;font-family:Inter,Segoe UI,"Microsoft YaHei",sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 20px 60px}h1{margin:0;font-size:28px}.hint{color:#8fa6c3;font-size:13px;line-height:1.6}.panel{margin-top:20px;padding:18px;border:1px solid #25344d;border-radius:16px;background:#0e192b}.grid{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px}.input,select{width:100%;border:1px solid #3a4a64;border-radius:9px;background:#091321;color:#dbeafe;padding:10px}.btn{border:0;border-radius:9px;padding:10px 14px;color:white;background:#2563eb;font-weight:700;cursor:pointer}.btn.small{padding:7px 10px;font-size:12px}.btn.cyan{background:#0891b2}.btn.red{background:#b91c1c}.btn.green{background:#047857}.btn.gray{background:#475569}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.list{display:grid;gap:12px;margin-top:14px}.card{padding:15px;border:1px solid #263751;border-radius:13px;background:#0a1424}.row{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.name{font-size:16px;font-weight:750}.badge{display:inline-block;margin-left:8px;padding:3px 8px;border-radius:999px;font-size:11px}.active{background:#064e3b;color:#a7f3d0}.revoked,.archived{background:#641b1b;color:#fecaca}.expired{background:#713f12;color:#fde68a}.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;margin:12px 0;color:#9db0c9;font-size:12px}.mono{font-family:Consolas,monospace;word-break:break-all}.actions{display:flex;flex-wrap:wrap;gap:7px}.issued{display:none;margin-top:14px;padding:14px;border:1px solid #0e7490;border-radius:12px;background:#083344}.issued.show{display:block}textarea{min-height:82px}.warn{color:#fbbf24}@media(max-width:760px){.grid{grid-template-columns:1fr}.meta{grid-template-columns:1fr}.row{display:block}}
  </style>
</head>
<body><main class="wrap">
  <h1>EXE License 签发与管理</h1>
  <p class="hint">此页面只在服务器管理端提供，不会打包进安装版或绿色版 EXE。产品标识固定为 <b>tools-platform-desktop</b>，两种 EXE 共用公司通用 License。有效期已写入数字签名，无网络也可在本地验证。</p>
  <section class="panel">
    <div class="grid">
      <input id="label" class="input" maxlength="120" placeholder="授权对象/电脑备注（必填，例如：张三-办公电脑）">
      <select id="days"><option value="30">30 天</option><option value="90">90 天</option><option value="180">180 天</option><option value="365">365 天</option></select>
      <input id="expiresAt" class="input" type="datetime-local" title="可选：指定精确到期时间">
      <button id="issue" class="btn">签发 License</button>
    </div>
    <div id="issued" class="issued"><div id="issuedMeta" class="hint"></div><textarea id="issuedToken" class="input mono" readonly></textarea><button id="copyIssued" class="btn small cyan">复制密钥</button></div>
  </section>
  <section class="panel">
    <div class="toolbar"><input id="search" class="input" style="max-width:520px" placeholder="搜索备注、License ID、状态"><label class="hint"><input id="showArchived" type="checkbox" checked> 显示已归档</label><button id="refresh" class="btn small gray">刷新</button></div>
    <div id="summary" class="hint" style="margin-top:10px"></div><div id="list" class="list"></div>
  </section>
</main><script>
const $=id=>document.getElementById(id);let records=[];const token=()=>localStorage.getItem('tools_token')||'';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>v?new Date(Number(v)).toLocaleString():'--';
async function api(path,options={}){const res=await fetch('/api/desktop-licenses'+path,{...options,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token(),...(options.headers||{})}});const body=await res.json().catch(()=>({}));if(!res.ok)throw new Error(body.error||`HTTP ${res.status}`);return body}
function effectiveStatus(r){if(r.status==='active'&&Date.now()>=r.expiresAt)return'expired';return r.status}
function identity(r){return `授权对象：${r.label||'未填写'}\n产品：Tools Platform Desktop（安装版+绿色版）\nLicense ID：${r.licenseId}\n到期：${fmt(r.expiresAt)}`}
function render(){const q=$('search').value.trim().toLowerCase();const rows=records.filter(r=>($('showArchived').checked||r.status!=='archived')&&[r.label,r.licenseId,r.status].join(' ').toLowerCase().includes(q));$('summary').textContent=`共 ${records.length} 条，当前显示 ${rows.length} 条`;$('list').innerHTML=rows.map(r=>{const s=effectiveStatus(r);return `<article class="card"><div class="row"><div><span class="name">${esc(r.label||'未填写授权对象')}</span><span class="badge ${s}">${esc(s)}</span></div><span class="hint">安装版 / 绿色版</span></div><div class="meta"><div>License ID：<span class="mono">${esc(r.licenseId)}</span></div><div>到期：<b class="${s==='expired'?'warn':''}">${fmt(r.expiresAt)}</b></div><div>签发：${fmt(Date.parse(r.issuedAt))}</div><div>最后更新：${fmt(Date.parse(r.updatedAt))}</div>${r.revokeReason?`<div>失效原因：${esc(r.revokeReason)}</div>`:''}</div><div class="actions"><button class="btn small cyan" data-a="copy" data-id="${r.licenseId}">复制密钥</button><button class="btn small" data-a="renew30" data-id="${r.licenseId}">+30天</button><button class="btn small" data-a="renew365" data-id="${r.licenseId}">+365天</button><button class="btn small gray" data-a="renewCustom" data-id="${r.licenseId}">指定日期</button>${r.status==='revoked'?`<button class="btn small green" data-a="restore" data-id="${r.licenseId}">恢复</button>`:`<button class="btn small red" data-a="revoke" data-id="${r.licenseId}">立即失效</button>`}${r.status!=='archived'?`<button class="btn small gray" data-a="archive" data-id="${r.licenseId}">归档</button>`:`<button class="btn small green" data-a="restore" data-id="${r.licenseId}">恢复</button>`}</div></article>`}).join('')||'<div class="hint">没有匹配记录</div>'}
async function load(){try{records=(await api('/?includeArchived=1')).licenses||[];render()}catch(e){$('summary').textContent='读取失败：'+e.message}}
$('issue').onclick=async()=>{const label=$('label').value.trim();if(!label)return alert('请填写授权对象/电脑备注，避免后续误操作。');const exact=$('expiresAt').value;try{const body=await api('/issue',{method:'POST',body:JSON.stringify({label,days:Number($('days').value),expiresAt:exact?new Date(exact).getTime():undefined})});$('issuedToken').value=body.token;$('issuedMeta').textContent=`${identity(body.record).replace(/\n/g,' ｜ ')}`;$('issued').classList.add('show');await load()}catch(e){alert('签发失败：'+e.message)}};
$('copyIssued').onclick=()=>navigator.clipboard.writeText($('issuedToken').value);$('search').oninput=render;$('showArchived').onchange=render;$('refresh').onclick=load;
$('list').onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;const r=records.find(x=>x.licenseId===b.dataset.id);if(!r)return;const a=b.dataset.a;try{if(a==='copy'){await navigator.clipboard.writeText(r.token);return}if(a==='revoke'){const reason=prompt(`确认让以下 License 立即失效？\n\n${identity(r)}\n\n请输入原因：`,'管理员手动失效');if(reason===null)return;await api(`/${r.licenseId}/revoke`,{method:'POST',body:JSON.stringify({reason})})}else if(a==='restore'){if(!confirm(`确认恢复？\n\n${identity(r)}\n\n若已过期，还需要续期。`))return;await api(`/${r.licenseId}/restore`,{method:'POST'})}else if(a==='archive'){const typed=prompt(`归档后 License 会失效。\n\n${identity(r)}\n\n为避免误操作，请输入完整 License ID：`,'');if(typed!==r.licenseId)return alert('License ID 不匹配，已取消。');await api(`/${r.licenseId}/archive`,{method:'POST'})}else{let payload={days:a==='renew365'?365:30};if(a==='renewCustom'){const value=prompt(`为以下 License 指定新到期日期（YYYY-MM-DD）：\n\n${identity(r)}`,'');if(!value)return;payload={expiresAt:new Date(value+'T23:59:59').getTime()}}if(!confirm(`确认续期并生成新密钥？\n\n${identity(r)}\n\n新密钥包含新的签名到期时间，需提供给用户重新输入。旧密钥可继续使用到原到期时间。`))return;const renewed=await api(`/${r.licenseId}/renew`,{method:'POST',body:JSON.stringify(payload)});$('issuedToken').value=renewed.token;$('issuedMeta').textContent=`续期换发成功 ｜ ${identity(renewed.record).replace(/\n/g,' ｜ ')}`;$('issued').classList.add('show');alert('续期换发成功，请复制页面上方的新密钥并提供给用户。')}await load()}catch(err){alert('操作失败：'+err.message)}};load();
</script></body></html>
